<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voxelbit</title>
<!-- ── WHAT A SEARCH RESULT SAYS ── without a description of its own, Google writes the snippet out of
     whatever text the page happens to expose, and the first text in this document is the settings
     menu. So the result for voxelbit.net read "voxelbit v1.2 sound volume 100% sfx 100% music 100%
     ambience 100% visuals 07:00 resolution 80% depth of field 30% snow off fullscreen off", which is
     a HUD dump rather than a description. One tag replaces it.
     Google treats this as a strong HINT and not an instruction, so it can still write its own, and it
     only changes after a re-crawl - days to weeks, sooner if the URL is submitted in Search Console.
     Keep it near 155 characters; past that it is cut off mid-sentence. -->
<meta name="description" content="A voxel world in your browser: chop and fell real trees, mine, craft and hunt across pine, oak, birch and desert country, through weather and nightfall.">
<link rel="canonical" href="https://voxelbit.net/">
<!-- ── AND WHAT A PASTED LINK LOOKS LIKE ── the same copy for Discord, Slack, iMessage and X. The image
     is game/logo.png, which is the logo master (tools/logo.png) copied in as-is, and deliberately NOT
     game/loading.png: that one is 2314x1156 and 5.2 MB, over Twitter's 5 MB ceiling, so a card built on
     it fetched nothing at all. A .ico is not a valid card image, which is why this is a second file. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="voxelbit">
<meta property="og:title" content="voxelbit">
<meta property="og:description" content="A voxel world in your browser: chop and fell real trees, mine, craft and hunt across pine, oak, birch and desert country, through weather and nightfall.">
<meta property="og:url" content="https://voxelbit.net/">
<meta property="og:image" content="https://voxelbit.net/logo.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#1b1c1f">
<link rel="icon" href="logo.ico?v=20260807h">
<link rel="apple-touch-icon" href="logo.png">
