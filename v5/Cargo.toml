# ---------------------------------------------------------------------------
# v5 -- an endless voxel pine forest, ray traced by Bevy Solari and denoised
#       by NVIDIA DLSS Ray Reconstruction.
#
# WHY THIS ENGINE EXISTS. v2 renders the same world on OptiX, which is a
# rendering API rather than a game one: it converges by brute force, so a
# moving camera is permanently back to one sample per pixel and the picture
# crawls. Every mode of the OptiX denoiser was tried on it and removed.
#
# Solari is the other half of the trade -- ReSTIR direct and indirect lighting
# at one or two rays per pixel, designed to be temporally reused rather than
# accumulated -- and DLSS Ray Reconstruction is a denoiser trained on exactly
# that signal, taking the guide buffers (depth, normal, roughness, motion
# vectors) that Solari already produces for it.
#
# BEVY IS A PATH DEPENDENCY, NOT A CRATES.IO ONE. It is taken from the local
# checkout at C:/Users/mrwbh/bevy (0.20.0-dev), because bevy_solari is not in
# any released version and the DLSS integration lives on the same branch.
# ---------------------------------------------------------------------------
[package]
name = "v5"
version = "0.1.0"
edition = "2024"
description = "An endless voxel pine forest, ray traced on Bevy Solari with DLSS Ray Reconstruction"
publish = false

# v5 MIRRORS BEVY'S DLSS FEATURE RATHER THAN JUST TURNING IT ON, and the
# distinction is not cosmetic: `#[cfg(feature = "dlss")]` in this crate's source
# reads THIS crate's feature list, not the one enabled on a dependency. Setting
# `features = ["dlss"]` on bevy alone would compile the DLSS support in and then
# gate every line that uses it to false -- an engine that builds, runs, links
# NGX, and never once inserts the denoiser.
[features]
default = ["dlss"]
dlss = ["bevy/dlss"]
# Lets `cargo build --all-features` work on a machine with no NGX SDK. Not for
# ordinary use; --no-dlss is the runtime switch.
force_disable_dlss = ["bevy/force_disable_dlss"]

[dependencies]
# f16 for the sky's emissive map. Already in the tree via bevy_image, so this
# pins nothing new.
half = "2"

# The local Bevy checkout. `3d` and `ui` are the stock profiles minus `audio`
# (this engine has no sound); `bevy_solari` is the raytracer, and the `dlss`
# feature above wires in the NGX SDK at C:/Users/mrwbh/DLSS -- see
# .cargo/config.toml, which points dlss_wgpu's build script at it.
bevy = { path = "C:/Users/mrwbh/bevy", default-features = false, features = [
  "3d",
  "ui",
  "bevy_solari",
  "png",
  "tonemapping_luts",
] }

[profile.dev]
opt-level = 1

# The meshing threads are the whole reason the world streams; unoptimised they
# are roughly twenty times slower and a chunk takes longer to build than to
# walk across.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
