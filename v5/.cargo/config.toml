# ---------------------------------------------------------------------------
# The three things dlss_wgpu's build script needs, pinned here so a build works
# from any shell without setting anything up first.
#
#   DLSS_SDK      the NGX SDK. Not redistributable, so it is referenced in
#                 place rather than vendored into this repo.
#   VULKAN_SDK    headers only -- DLSS is a Vulkan feature and its bindings are
#                 generated against vulkan.h. The loader itself ships with the
#                 driver; this is the SDK the bindgen pass compiles against.
#   LIBCLANG_PATH bindgen needs libclang to parse those headers at build time.
#
# All three are build-time only: the shipped exe needs none of them.
# ---------------------------------------------------------------------------
[env]
DLSS_SDK = "C:/Users/mrwbh/DLSS"
VULKAN_SDK = "C:/VulkanSDK/1.4.357.0"
LIBCLANG_PATH = "C:/Program Files/LLVM/bin"
