<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>voxelbit™ — space</title>
  <link rel="icon" type="image/x-icon" href="../logo.ico">
  <style>
    @font-face { font-family: "3x3"; src: url("../3x3-pixel.otf") format("opentype"); font-display: block; }
    :root { --pixel: "3x3", monospace; --red: #E03030; --lime: #8DC63F; --white: #f0f4f8; --gold: #ffd76a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #05060d; touch-action: none; }   /* touch-action:none → drags/taps drive the game, not browser scroll/zoom */
    body { font-family: var(--pixel); text-transform: lowercase; color: var(--white); cursor: crosshair; }
    a, button { cursor: inherit; }   /* no hand cursor anywhere — links/buttons use the crosshair too */
    body.controlling { cursor: none; }   /* cursor pinned (pointer lock) → hide the OS cursor, show the reticle instead */
    #reticle { position: fixed; left: 0; top: 0; width: 24px; height: 24px; z-index: 70; pointer-events: none; display: none; color: #fff; opacity: 0.8; }   /* the "+" cursor — matches earth.html's crosshair (white "+" at 80%, with a dark glow for contrast) */
    body.controlling #reticle { display: block; }
    #reticle svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 1px rgba(0,0,0,0.7)); }
    canvas { display: block; }

    .vignette { position: fixed; inset: 0; z-index: 40; pointer-events: none;
      box-shadow: inset 0 0 240px 50px rgba(0,0,0,0.78); }
    .warp { position: fixed; inset: 0; z-index: 42; pointer-events: none; opacity: 0; transition: opacity 0.25s;
      background: radial-gradient(circle at center, transparent 32%, rgba(90,130,255,0.10) 70%, rgba(140,90,255,0.24) 100%); }
    .warp.on { opacity: 1; }

    .hud { position: fixed; z-index: 60; pointer-events: none; }
    body.ui-hidden .hud, body.ui-hidden .back { display: none !important; }
    body.game-over .hud, body.game-over .back { display: none !important; }   /* game over screen: hide all HUD (back, keybinds, score, etc.) */
    body.cinematic .hud, body.cinematic .back { display: none !important; }   /* cinematic mode → hide all the HUD */
    /* cinematic-mode indicator (top-center) — film icon + red label, beeping, shown in-game when cinematic is on */
    #cineTag { position: fixed; top: 1.2rem; left: 50%; transform: translateX(-50%); z-index: 60; display: none; align-items: center; gap: 0.45em; font-family: var(--pixel); text-transform: lowercase; font-size: 0.55rem; letter-spacing: 0.06em; color: var(--red); pointer-events: none; white-space: nowrap; }
    #cineTag .cine-ico { width: 1.3rem; height: 1.3rem; display: block; }   /* solid (no blink) */
    #cineTag .cine-label { position: relative; top: -1px; }
    @keyframes cineBeep { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    body.cinematic #cineTag, body.cinematic #fpsTag, body.cinematic #reticle, body.cinematic #planetName { display: none !important; }   /* cinematic: hide the UI */
    body.ui-hidden { cursor: none; }
    /* menu backdrop: hide the HUD but keep the crosshair and visible shots so you can fly + shoot */
    body.menu-bg .hud, body.menu-bg .back { display: none !important; }
    body.menu-bg .lil-gui { display: none !important; }   /* nebula-glow slider only when asteroids.html is open directly, not as the menu backdrop */
    body.menu-bg #fpsTag, body.menu-bg #cineTag, body.menu-bg #planetName { display: none !important; }   /* as a backdrop / loading screen: hide the fps counter (+ cinematic/planet tags) too */
    .head { top: 1.2rem; left: 1.5rem; font-size: 0.9rem; letter-spacing: 0.04em; line-height: 1.1; }   /* below the game-over overlay (70), so it's hidden on the game over screen */
    .head .wordmark { display: block; margin-bottom: 0.22em; }   /* gap under voxelbit, like the exchange page */
    .head .voxel { color: var(--red); }
    .head .bit { color: var(--lime); }
    .head .ver-sup { font-size: 0.16em; letter-spacing: 0.08em; color: rgba(240,244,248,0.5); vertical-align: top; margin-left: 0.1em; line-height: 1; }
    /* "asteroids" sits in white underneath the wordmark, like the other pages */
    .head .crumb { display: block; font-size: 1em; letter-spacing: 0.04em; line-height: 1.3; padding-bottom: 0.08em; color: rgba(240,244,248,0.72); transition: opacity 0.5s ease, transform 0.5s ease; }
    /* white LED sweeps the "asteroids" letters left→right then right→left (same setup as game over) */
    .head .crumb span { display: inline-block; }
    .head .crumb span:nth-child(1) { animation: goa0 2.4s linear infinite; }
    .head .crumb span:nth-child(2) { animation: goa1 2.4s linear infinite; }
    .head .crumb span:nth-child(3) { animation: goa2 2.4s linear infinite; }
    .head .crumb span:nth-child(4) { animation: goa3 2.4s linear infinite; }
    .head .crumb span:nth-child(5) { animation: goa4 2.4s linear infinite; }
    .head .crumb span:nth-child(6) { animation: goa5 2.4s linear infinite; }
    .head .crumb span:nth-child(7) { animation: goa6 2.4s linear infinite; }
    .head .crumb span:nth-child(8) { animation: goa7 2.4s linear infinite; }
    .head .crumb span:nth-child(9) { animation: goa8 2.4s linear infinite; }
    @keyframes goa0 { 0% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 4%,96% { color:rgba(240,244,248,0.72); text-shadow:none; } 100% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } }
    @keyframes goa1 { 0%,2% { color:rgba(240,244,248,0.72); text-shadow:none; } 6% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 10%,90% { color:rgba(240,244,248,0.72); text-shadow:none; } 94% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 98%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    @keyframes goa2 { 0%,9% { color:rgba(240,244,248,0.72); text-shadow:none; } 13% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 17%,84% { color:rgba(240,244,248,0.72); text-shadow:none; } 88% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 92%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    @keyframes goa3 { 0%,15% { color:rgba(240,244,248,0.72); text-shadow:none; } 19% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 23%,77% { color:rgba(240,244,248,0.72); text-shadow:none; } 81% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 85%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    @keyframes goa4 { 0%,21% { color:rgba(240,244,248,0.72); text-shadow:none; } 25% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 29%,71% { color:rgba(240,244,248,0.72); text-shadow:none; } 75% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 79%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    @keyframes goa5 { 0%,27% { color:rgba(240,244,248,0.72); text-shadow:none; } 31% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 35%,65% { color:rgba(240,244,248,0.72); text-shadow:none; } 69% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 73%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    @keyframes goa6 { 0%,34% { color:rgba(240,244,248,0.72); text-shadow:none; } 38% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 42%,58% { color:rgba(240,244,248,0.72); text-shadow:none; } 62% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 66%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    @keyframes goa7 { 0%,40% { color:rgba(240,244,248,0.72); text-shadow:none; } 44% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 48%,52% { color:rgba(240,244,248,0.72); text-shadow:none; } 56% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 60%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    @keyframes goa8 { 0%,46% { color:rgba(240,244,248,0.72); text-shadow:none; } 50% { color:#fff; text-shadow:0 0 14px rgba(255,255,255,0.9); } 54%,100% { color:rgba(240,244,248,0.72); text-shadow:none; } }
    /* the whole HUD title gives a small idle shake (smaller than the big titles, to suit the corner HUD) */
    @keyframes hudShake {
      0%{transform:translate(0,0) rotate(0deg);} 15%{transform:translate(-1.5px,0.8px) rotate(-0.4deg);}
      30%{transform:translate(1.5px,-0.8px) rotate(0.4deg);} 45%{transform:translate(-0.8px,-1.5px) rotate(-0.3deg);}
      60%{transform:translate(1.2px,1.5px) rotate(0.35deg);} 75%{transform:translate(-1.5px,-0.8px) rotate(-0.35deg);}
      90%{transform:translate(0.8px,1.2px) rotate(0.3deg);} 100%{transform:translate(0,0) rotate(0deg);}
    }
    /* embedded in the menu: the menu's persistent logo is shown as the wordmark; the crumb slides in after */
    html.embed .head .wordmark { visibility: hidden; }
    html.embed .head .crumb { display: none; }   /* the menu's flown logo carries its own "asteroids" crumb — don't show the game's LED copy too */

    /* spinning LED border (same as the credits / exchange buttons) */
    @property --led { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
    @keyframes ledSpin { to { --led: 360deg; } }
    .led-ring::after {
      content: ""; position: absolute; inset: 0; border-radius: 999px; padding: 2px;
      background: conic-gradient(from var(--led), transparent 0deg, transparent 250deg, #ffd76a 300deg, #fff3d0 332deg, transparent 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; filter: drop-shadow(0 0 4px #ffd76a);
      animation: ledSpin 3s linear infinite;
    }

    .back { position: fixed; z-index: 60; top: 1.3rem; right: 1.5rem; pointer-events: auto;
      font-family: var(--pixel); text-transform: lowercase; font-size: 0.5rem; letter-spacing: 0.08em;
      color: var(--gold); text-decoration: none; border: 2px solid var(--gold); border-radius: 999px; padding: 0.5rem 1.1rem;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.15s, color 0.15s, box-shadow 0.2s; }
    .back:hover { transform: translateY(-3px); background: linear-gradient(180deg, #ffe08a, #e0a830);
      color: #5a3e00; border-color: transparent; box-shadow: 0 10px 22px rgba(255,215,106,0.45); }

    .telem { left: 1.5rem; bottom: 1.2rem; font-size: 0.45rem; letter-spacing: 0.1em; color: rgba(240,244,248,0.55); line-height: 1.95; }
    .telem .k { color: rgba(240,244,248,0.35); }
    .telem .v { color: var(--lime); }
    .telem .v.boost { color: var(--red); }
    .hint { right: 1.5rem; bottom: 1.2rem; text-align: right; font-size: 0.4rem; letter-spacing: 0.12em; color: #ffd76a; line-height: 1.95; }
    .hint .led, #fpsTag .led { display: inline-block; animation: hintLed 1.8s linear infinite; animation-delay: calc(var(--i, 0) * 0.05s); }   /* gold LED sweeps letter by letter, like the © 2026 voxelbit footer */
    @keyframes hintLed { 0%, 12%, 100% { color: #ffd76a; text-shadow: none; } 6% { color: #fff8e0; text-shadow: 0 0 7px rgba(255,248,200,0.95); } }
    /* on game start a "shift — boost" cue pops up below the cursor, then flies down into its resting
       spot inside the bottom-right hint (desktop only — touch uses the on-screen boost button). */
    .shift-cue { z-index: 66; white-space: nowrap; display: none;
      font-size: 0.4rem; letter-spacing: 0.12em; color: #ffd76a; }
    .shift-cue .led { display: inline-block; animation: hintLed 1.8s linear infinite; animation-delay: calc(var(--i, 0) * 0.05s); }   /* gold LED sweep, like the keybinds */

    /* ── on-screen touch controls (shown only on touch devices via body.touch) ── */
    .boost-btn, .joystick { display: none; }
    /* boost: a round button bottom-right, mirroring the joystick circle bottom-left */
    body.touch .boost-btn {
      display: flex; align-items: center; justify-content: center;
      right: 1.6rem; bottom: 2rem; width: 104px; height: 104px; border-radius: 50%; padding: 0;
      font-family: var(--pixel); text-transform: lowercase; font-size: 0.55rem; letter-spacing: 0.06em;
      color: var(--lime); background: rgba(8,12,16,0.4); border: 1px solid rgba(141,198,63,0.4);
      pointer-events: auto; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    body.touch .boost-btn.active { background: linear-gradient(180deg, #b2e06a, #82b73d); color: #fff; border-color: transparent; }
    /* left-bottom virtual joystick → steer the camera */
    body.touch .joystick { display: block; left: 1.6rem; bottom: 2rem; width: 104px; height: 104px; border-radius: 50%; background: rgba(8,12,16,0.4); border: 1px solid rgba(141,198,63,0.3); pointer-events: auto; touch-action: none; }
    .joy-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(141,198,63,0.45); border: 1px solid rgba(141,198,63,0.7); box-shadow: 0 0 10px rgba(141,198,63,0.4); }
    body.touch .hint, body.touch .shift-cue { display: none !important; }   /* the keyboard hint is meaningless on touch */
    /* mobile: center the voxelbit/asteroids title and tuck the score directly beneath it
       (centering via left/right + text-align so it doesn't fight the hudShake transform or the logo morph) */
    body.touch .head { left: 0; right: 0; text-align: center; top: calc(1.2rem + 8px); font-size: 1rem; }   /* mobile: nudge the white-crumb title down 8px + slightly bigger */
    body.touch .score { top: 4rem; }
    /* hide the on-screen controls when the HUD is hidden (H) or while acting as the menu backdrop */
    body.touch.ui-hidden .boost-btn, body.touch.ui-hidden .joystick,
    body.menu-bg .boost-btn, body.menu-bg .joystick { display: none !important; }


    .thr { left: 50%; bottom: 1.3rem; transform: translateX(-50%); width: 160px; height: 5px;
      background: rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; }
    .thr i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--lime), #d4f59a); transition: width 0.1s, background 0.2s; }
    .thr.boost i { background: linear-gradient(90deg, #f2554b, #ff8a8a); }

    .score { top: 1.2rem; left: 50%; transform: translateX(-50%); font-size: 0.75rem; letter-spacing: 0.12em; color: var(--gold); text-shadow: 0 0 8px rgba(255,215,106,0.5); }
    .cruisetag { top: 3.0rem; left: 50%; transform: translateX(-50%); font-size: 0.45rem; letter-spacing: 0.2em; color: rgba(141,198,63,0.75); text-shadow: 0 0 8px rgba(141,198,63,0.4); }
    #fpsTag { display: none !important; position: fixed; z-index: 60; pointer-events: none; top: 0.6rem; left: 1.5rem; font-size: 0.4rem; letter-spacing: 0.12em; color: #ffd76a; line-height: 1.95; }   /* fps counter REMOVED (was top-left) — hidden everywhere via !important so the showFps message can't reveal it */
    #planetName { position: fixed; left: 50%; top: 45%; transform: translateX(-50%); z-index: 55; pointer-events: none; opacity: 0; transition: opacity 0.6s; white-space: nowrap; font-size: 0.8rem; letter-spacing: 0.12em; line-height: 1.95; color: #ffd76a; }   /* centered; .hint keybind letter styling at 2× the size */
    #planetName .led { display: inline-block; animation: hintLed 1.8s linear infinite; animation-delay: calc(var(--i, 0) * 0.05s); }   /* per-letter gold LED, identical to .hint */
    #planetName.on { opacity: 0.8; }   /* fades in to 20%-transparent gold when a planet is near */
    body.menu-bg #planetName { display: none; }   /* hidden in the menu backdrop */
    /* #fpsTag visibility is controlled by the fps icon (showFps message), so it can show in the menu backdrop + cinematic too */
    #earthWarp { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.7s ease; z-index: 500; }
    #earthWarp.on { opacity: 1; }
    @keyframes scoreBounce {
      0%   { transform: translateX(-50%) scale(1); }
      35%  { transform: translateX(-50%) scale(1.45); }
      100% { transform: translateX(-50%) scale(1); }
    }
    .score.bounce { animation: scoreBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .score .k { color: rgba(240,244,248,0.4); font-size: 0.45rem; letter-spacing: 0.2em; margin-right: 0.4rem; }
    /* a bright green LED lights one score digit at a time, sweeping left→right then right→left (like "game over") */
    #score .d { display: inline-block; transition: color 0.25s ease, text-shadow 0.25s ease; }
    #score .d.lit { color: #fff3d0; text-shadow: 0 0 10px rgba(255,215,106,0.95); }

    .popup { position: fixed; z-index: 65; transform: translate(-50%,-50%); pointer-events: none; white-space: nowrap;
      font-family: var(--pixel); text-transform: lowercase; font-size: 0.6rem; letter-spacing: 0.1em;
      color: var(--gold); text-shadow: 0 0 8px rgba(255,215,106,0.8); animation: popRise 1s ease-out forwards; }
    @keyframes popRise {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.7); }
      15%  { opacity: 1; transform: translate(-50%,-80%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-180%) scale(1); }
    }

    /* the game-over screen now lives in the shell (index.html) — these styles were removed from asteroids */

    .nowebgl { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
      text-align: center; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--red); padding: 2rem; }
  </style>
</head>

  <script>
    // when we're the menu backdrop (?bg) hide the HUD from the very FIRST paint. the module script
    // below also adds this class, but it's deferred — so without this the HUD flashes for a frame on
    // every menu refresh before the module runs.
    if (new URLSearchParams(location.search).has('bg')) document.body.classList.add('menu-bg');
    try { if (localStorage.getItem('vbCinematic') === '1') document.body.classList.add('cinematic'); } catch (e) {}   // cinematic mode → hide the HUD, show the indicator
    // ── global SFX volume: scale every sound effect by the menu's sound-effects slider (this page has no music of its own) ──
    (function () {
      const proto = HTMLMediaElement.prototype, desc = Object.getOwnPropertyDescriptor(proto, 'volume');
      if (!desc || !desc.set) return;
      let sfxVol = 1;
      try { const v = parseFloat(localStorage.getItem('vbSfxVolume')); if (!isNaN(v)) sfxVol = Math.max(0, Math.min(1, v)); } catch (e) {}
      const reg = [];
      Object.defineProperty(proto, 'volume', {
        configurable: true,
        get() { return this.__sfxBase !== undefined ? this.__sfxBase : desc.get.call(this); },
        set(v) { this.__sfxBase = v; if (reg.indexOf(this) < 0) reg.push(this); desc.set.call(this, v * sfxVol * 0.576); }   // ~42% global sfx trim
      });
      window.__setSfxVol = (val) => { sfxVol = Math.max(0, Math.min(1, val)); for (const a of reg) { try { a.volume = a.__sfxBase; } catch (e) {} } };
    })();
  </script>

  <script>(function () { const h = document.querySelector('.hint'); if (!h) return; const ctr = { i: 0 }; (function ledify(node) { for (const n of [...node.childNodes]) { if (n.nodeType === 3) { const frag = document.createDocumentFragment(); for (const ch of n.textContent) { const s = document.createElement('span'); s.style.setProperty('--i', ctr.i++); if (ch === ' ') s.innerHTML = '&nbsp;'; else { s.textContent = ch; s.className = 'led'; } frag.appendChild(s); } node.replaceChild(frag, n); } else if (n.nodeType === 1 && n.tagName !== 'BR') ledify(n); } })(h); })();</script>

  <script type="module">

      const len = Math.hypot(dx, dy);
      if (len > JOY_R) { dx = dx / len * JOY_R; dy = dy / len * JOY_R; }
      joyKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      joyX = dx / JOY_R; joyY = dy / JOY_R;     // -1..1 (x right+, y down+)
    }
    function resetJoy() { joyId = null; joyX = 0; joyY = 0; if (joyKnob) joyKnob.style.transform = 'translate(0,0)'; }
    if (joy) {
      joy.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); const t = e.changedTouches[0]; joyId = t.identifier; updateJoy(t); }, { passive: false });

    }
    // tap / drag anywhere else: aim the shots AT the finger and fire (skip the joystick + on-screen buttons)
    const aimAt = t => { mouseNDC.x = (t.clientX / innerWidth) * 2 - 1; mouseNDC.y = -(t.clientY / innerHeight) * 2 + 1; };
    let fireId = null;
    addEventListener('touchstart', e => {
      for (const t of e.changedTouches) {
        if (t.target && t.target.closest && t.target.closest('.joystick, .touch-btn, .back, .go-btn')) continue;
        fireId = t.identifier; aimAt(t); firing = true; break;
      }
    }, { passive: true });
    addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === fireId) aimAt(t); }, { passive: true });
    const endFire = e => { for (const t of e.changedTouches) if (t.identifier === fireId) { fireId = null; firing = false; } };
    addEventListener('touchend', endFire);
    addEventListener('touchcancel', () => { fireId = null; firing = false; });
    const holdBtn = (el, on, off) => {   // press-and-hold button (boost / stop)
      if (!el) return;
      el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('active'); on(); }, { passive: false });
      const up = () => { el.classList.remove('active'); off(); };
      el.addEventListener('touchend', up); el.addEventListener('touchcancel', up);
    };
    holdBtn(document.getElementById('tcBoost'), () => { if (!keys.boost) { keys.boost = true; playBoost(); } }, () => keys.boost = false);
    function fireLasers() {
      playShoot();
      ray.setFromCamera(mouseNDC, camera);     // aim toward the cursor
      const dir = ray.ray.direction;
      const g = new THREE.Group();
      const core = new THREE.Mesh(bulletGeo, bulletMat); core.scale.setScalar(2.6); g.add(core);
      const glow = new THREE.Mesh(bulletGlowGeo, bulletGlowMat); glow.scale.setScalar(5.2); g.add(glow);
      g.visible = !uiHidden;                   // shots hidden only in clean view (H); visible in normal play
      g.position.copy(ship).addScaledVector(dir, 16);
      scene.add(g);
      lasers.push({ mesh: g, vx: dir.x * 12, vy: dir.y * 12, vz: dir.z * 12, ttl: 100 });
    }

    const warpEl = document.getElementById('warp');
    const _zAxis = new THREE.Vector3(0, 0, 1);
    const _dq = new THREE.Quaternion(), _roll = new THREE.Quaternion(), _eul = new THREE.Euler(0, 0, 0, 'YXZ');
    const _cineM = new THREE.Matrix4(), _cineQ = new THREE.Quaternion(), _camUp = new THREE.Vector3(0, 1, 0), _fwdT = new THREE.Vector3();   // cinematic camera: looks at a planet only while its name is up, else forward
    const _panLeft = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.55);   // planet framing panned ~31° left (the planet sits toward the right of the view)
    { _cineM.lookAt(camera.position, _fwdT.copy(_moveFwd).add(camera.position), _camUp); lookQuat.setFromRotationMatrix(_cineM); camera.quaternion.copy(lookQuat); }   // start looking forward along the flight path (no planet is name-range close yet)
    let T = 0, _lastT = performance.now(), _fpsFrames = 0, _fpsLast = performance.now();

    function ledFps(el, t) { const chars = [...t]; if (el.childElementCount === chars.length) { for (let i = 0; i < chars.length; i++) el.children[i].textContent = chars[i] === ' ' ? ' ' : chars[i]; return; } el.innerHTML = ''; let i = 0; for (const ch of chars) { const s = document.createElement('span'); s.style.setProperty('--i', i++); if (ch === ' ') s.innerHTML = '&nbsp;'; else { s.textContent = ch; s.className = 'led'; } el.appendChild(s); } }   // gold per-letter LED sweep for the fps counter (reuses spans when the length is unchanged so the sweep keeps looping)

    let _vbStopped = false;   // set via a 'vbFreeze' message from the parent (rt.html) → halt the loop so the WebGPU game isn't starved during the load→game transition
    function tick() {
      if (_vbStopped) { return; }   // frozen: hold the last rendered frame, stop scheduling RAF (no more GPU/CPU work)
      requestAnimationFrame(tick);
      const _now = performance.now();
      let fs = (_now - _lastT) / (1000 / 60);   // frames elapsed since last tick (1.0 @ 60fps)
      _lastT = _now;
      _fpsFrames++; if (_now - _fpsLast >= 500) { const fe = document.getElementById('fpsTag'); if (fe) ledFps(fe, Math.round(_fpsFrames * 1000 / (_now - _fpsLast)) + ' fps'); _fpsFrames = 0; _fpsLast = _now; }
      if (fs > 4) fs = 4;                         // clamp big gaps (background tab / hitches)
      fs *= 1.2;                                  // ×1.2 = asteroids runs 20% faster overall. NOTE: gameSpeed no longer scales the whole sim — it's applied to the SHIP only (below), so asteroids/planets keep moving at their own pace
      T += 0.016 * fs;

      // WASD or the on-screen joystick steers the view (smoothed turn rate); the joystick only applies
      // in the real game, never the menu backdrop. joystick right ⇒ turn right, joystick up ⇒ look up.
      const inBg = document.body.classList.contains('menu-bg');
      if (cinematic) {   // cinema: ship flies along its frozen heading; the camera does a heavy-drag look around it
        if (cineMode === 'auto') { cineYawT += 0.0016; cinePitchT = Math.sin(cineYawT * 0.5) * 0.12; }   // AUTO → slow self-driven sweep (gentle yaw drift + pitch bob), eased by the same heavy drag
        cineYaw += (cineYawT - cineYaw) * CINE_DRAG; cinePitch += (cinePitchT - cinePitch) * CINE_DRAG;   // ease toward the target (mouse in manual, auto-sweep in auto) — heavy drag
        _cineLook.setFromEuler(_eul.set(cinePitch, cineYaw, 0));
        camera.quaternion.copy(lookQuat).multiply(_cineLook);
      } else {
        cineYaw = cinePitch = cineYawT = cinePitchT = 0;   // recenter so entering cinema starts from the current view
        const jx = inBg ? 0 : joyX, jy = inBg ? 0 : joyY;   // steering: WASD / joystick turn-rate → lookQuat (the ship's heading)
        const ty = (((keys.a?1:0) - (keys.d?1:0)) - jx) * MAXRATE;
        const tp = (((keys.w?1:0) - (keys.s?1:0)) - jy) * MAXRATE;
        vYaw += (ty - vYaw) * ACC;
        vPitch += (tp - vPitch) * ACC;
        _dq.setFromEuler(_eul.set(vPitch, vYaw, 0)); lookQuat.multiply(_dq);
        turn += (vYaw / MAXRATE - turn) * 0.1; _roll.setFromAxisAngle(_zAxis, turn * 0.45);   // banking from turn rate
        camera.quaternion.copy(lookQuat).multiply(_roll);
      }

      // forward flight — throttle controls speed in BOTH modes (cinema does NOT change it); the ship always flies where it's steered
      const boosting = keys.boost;
      const speed = dead ? 0 : throttle * (boosting ? 5.625 : 1.8);   // cruise 1.8 + boost 5.625 — both 1.5x faster (from 1.2 / 3.75)
      forward.set(0, 0, -1).applyQuaternion(lookQuat);
      _moveFwd.copy(forward);
      ship.addScaledVector(_moveFwd, speed * fs * gameSpeed);   // the speed slider scales ONLY the ship's travel (gameSpeed); the rest of the world moves regardless
      camera.position.copy(ship);   // first-person view

      // the Earth turns slowly; flying into it (real game only) fades down to the survival world
      earth.rotateY(0.0008 * fs); mars.rotateY(0.0006 * fs);   // axial spin (Mars a touch slower), about the LOCAL tilted y-axis so the caps stay tilted
      earthClouds.rotateY(0.0015 * fs);   // clouds clearly drift over the earth's surface (faster than the surface spin)
      earthOrbit += 0.00033 * fs; earth.position.set(sunPos.x + Math.cos(earthOrbit) * EARTH_ORBIT, sunPos.y, sunPos.z + Math.sin(earthOrbit) * EARTH_ORBIT);   // Earth orbits the sun (Kepler speeds recomputed for the new wider radii)
      marsOrbit += 0.00021 * fs; mars.position.set(sunPos.x + Math.cos(marsOrbit) * MARS_ORBIT, sunPos.y, sunPos.z + Math.sin(marsOrbit) * MARS_ORBIT);   // Kepler: slower than Earth (outer orbit)
      mercOrbit += 0.001 * fs; mercury.position.set(sunPos.x + Math.cos(mercOrbit) * MERC_ORBIT, sunPos.y, sunPos.z + Math.sin(mercOrbit) * MERC_ORBIT); mercury.rotateY(0.0008 * fs);   // innermost → fastest
      venusOrbit += 0.00052 * fs; venus.position.set(sunPos.x + Math.cos(venusOrbit) * VENUS_ORBIT, sunPos.y + Math.sin(venusOrbit) * VENUS_ORBIT * VENUS_INC, sunPos.z + Math.sin(venusOrbit) * VENUS_ORBIT * VENUS_INC_Z); venus.rotateY(-0.0003 * fs);   // Venus spins retrograde; orbit tilted (VENUS_INC) so it clears Earth
      moonOrbit += 0.008 * fs; moon.position.set(earth.position.x + Math.cos(moonOrbit) * MOON_ORBIT, earth.position.y, earth.position.z + Math.sin(moonOrbit) * MOON_ORBIT); moon.rotateY(0.001 * fs);   // Moon laps the Earth ~13× per Earth orbit (≈ the real Moon-month : year ratio)
      saturnOrbit += 0.00007 * fs; saturn.position.set(sunPos.x + Math.cos(saturnOrbit) * SATURN_ORBIT, sunPos.y, sunPos.z + Math.sin(saturnOrbit) * SATURN_ORBIT); saturn.rotateY(0.0005 * fs);   // Kepler: far + slow, spins about its tilted axis
      jupiterOrbit += 0.000115 * fs; jupiter.position.set(sunPos.x + Math.cos(jupiterOrbit) * JUP_ORBIT, sunPos.y, sunPos.z + Math.sin(jupiterOrbit) * JUP_ORBIT); jupiter.rotateY(0.0011 * fs);   // Kepler; still spins fastest (about its slight tilt)
      uranusOrbit += 0.000046 * fs; uranus.position.set(sunPos.x + Math.cos(uranusOrbit) * URANUS_ORBIT, sunPos.y, sunPos.z + Math.sin(uranusOrbit) * URANUS_ORBIT); uranus.rotateY(0.0009 * fs);   // Kepler: very slow (far out)
      neptOrbit += 0.000032 * fs; neptune.position.set(sunPos.x + Math.cos(neptOrbit) * NEPT_ORBIT, sunPos.y, sunPos.z + Math.sin(neptOrbit) * NEPT_ORBIT); neptune.rotateY(0.0009 * fs);   // Kepler: slowest (outermost)
      if (spaceChicken) { spaceChicken.rotation.y += 0.007 * fs; spaceChicken.rotation.x += 0.003 * fs;   // tumbles like an asteroid (faster now), no walk animation
        const cm = spaceChicken.userData.mesh, cb = spaceChicken.userData.blink;
        if (cm && cm.userData.eyeIdx >= 0 && cb && cm.instanceColor) {
          if (!cb.on && T >= cb.next) { cb.on = true; cb.until = T + 0.12; cm.setColorAt(cm.userData.eyeIdx, _eyeWhite); cm.instanceColor.needsUpdate = true; }   // blink: black eye → white
          else if (cb.on && T >= cb.until) { cb.on = false; cb.next = T + 2 + Math.random() * 4; cm.setColorAt(cm.userData.eyeIdx, _eyeBlack); cm.instanceColor.needsUpdate = true; }   // → back to black
        }
      }
      if (planetNameEl) {   // show the nearest planet's name only within ~100 of its surface; fade it in, then fade out after 5s
        let nn = null, nd = Infinity;
        if (!dead) for (const p of planetList) { const d = ship.distanceTo(p.m.position); if (d < p.r * 3 + 2000 && d < nd) { nn = p.n; nd = d; } }   // name pops up from much further out (scales with planet size) to suit the 2× wider system
        if (nn !== _lastNear) {
          _lastNear = nn; clearTimeout(_nameTimer);
          if (nn) { planetNameEl.innerHTML = ''; [...nn].forEach((ch, i) => { const s = document.createElement('span'); s.className = 'led'; s.style.setProperty('--i', i); s.textContent = ch; planetNameEl.appendChild(s); }); planetNameEl.classList.add('on'); _nameTimer = setTimeout(() => planetNameEl.classList.remove('on'), 5000); }   // fade in + per-letter LED, schedule the 5s fade-out
          else planetNameEl.classList.remove('on');   // left the radius → fade out
        }
      }
      if (!cruise && !warping && ship.distanceTo(earth.position) < EARTH_R) {
        warping = true;
        const w = document.getElementById('earthWarp'); if (w) w.classList.add('on');
        setTimeout(() => { location.href = 'earth.html'; }, 750);
      }
      if (!cruise && !dead && !cinematic && ship.distanceTo(sunPos) < SUN_R) gameOver();   // flying into the sun = death (cinematic is invincible)

      // lasers + collision with asteroids
      cool--;
      if (firing && !dead && cool <= 0) { fireLasers(); cool = fireCooldown; }
      for (let i = lasers.length - 1; i >= 0; i--) {
        const L = lasers[i];
        L.mesh.position.x += L.vx; L.mesh.position.y += L.vy; L.mesh.position.z += L.vz;
        L.mesh.rotation.x += 0.1; L.mesh.rotation.y += 0.08;
        L.ttl--;
        if (!uiHidden) {   // pixelated trail cube behind the bullet (skipped in clean view)
          const tp = getTrailCube();
          tp.position.copy(L.mesh.position);
          scene.add(tp); fx.push({ type: 'trail', obj: tp, ttl: 14, life: 14 });
        }
        let hit = false;
        for (const R of rocks) {
          const ddx = L.mesh.position.x - R.mesh.position.x, ddy = L.mesh.position.y - R.mesh.position.y, ddz = L.mesh.position.z - R.mesh.position.z;
          const rr = R.radius + 2;
          if (ddx*ddx + ddy*ddy + ddz*ddz < rr*rr) { destroyRock(R); hit = true; break; }
        }
        if (!hit && spaceChicken) { const cdx = L.mesh.position.x - spaceChicken.position.x, cdy = L.mesh.position.y - spaceChicken.position.y, cdz = L.mesh.position.z - spaceChicken.position.z, cr = (spaceChicken.userData.radius || 60) + 2; if (cdx*cdx + cdy*cdy + cdz*cdz < cr*cr) { destroyChicken(); hit = true; } }   // shoot the floating chicken → +100, like an asteroid
        if (hit || L.ttl <= 0) { scene.remove(L.mesh); lasers.splice(i, 1); }
      }

      // asteroids: drift + spin; recycle far-off rocks by re-placing them out of view (no pop-in)
      for (const R of rocks) {
        R.mesh.position.x += R.vx*fs; R.mesh.position.y += R.vy*fs; R.mesh.position.z += R.vz*fs;
        R.mesh.rotation.x += R.sx*fs; R.mesh.rotation.y += R.sy*fs; R.mesh.rotation.z += R.sz*fs;
        const rdx = R.mesh.position.x - ship.x, rdy = R.mesh.position.y - ship.y, rdz = R.mesh.position.z - ship.z;
        if (rdx*rdx + rdy*rdy + rdz*rdz > RECYCLE_DIST*RECYCLE_DIST) {
          aimFromAhead(_opos, _ovel, R.tier === 2 ? BIG_SPD_MUL : 1);
          R.mesh.position.copy(_opos);
          R.vx = _ovel.x; R.vy = _ovel.y; R.vz = _ovel.z;
        }
      }
      // maintain a baseline of BIG asteroids (the original starting density): only top the field
      // back up to ~8 bigs, so it never floods at once. the fragments those bigs break into are
      // never removed (only recycled), so the field gets denser over time the more you shoot —
      // up to a high safety cap so a long session can't runaway and tank the framerate.
      let bigCount = 0; for (const R of rocks) if (R.tier === 2) bigCount++;
      if (bigCount < 8 && rocks.length < 150 && Math.random() < 0.04) spawnBig();   // mobile now matches desktop's asteroid caps (was 5 big / 70 rocks on mobile)

      // ship hits an asteroid → game over, but ONLY if the rock is in front of the ship
      if (!dead && !cruise && !cinematic) {   // cinematic mode → immune (asteroids pass through)
        for (const R of rocks) {
          const ddx = ship.x - R.mesh.position.x, ddy = ship.y - R.mesh.position.y, ddz = ship.z - R.mesh.position.z;
          const rr = R.radius + 4, d2 = ddx*ddx + ddy*ddy + ddz*ddz;
          if (d2 < rr*rr) {
            // toRock·forward / dist = cos(angle from where you're looking); side/back hits pass through
            const front = -(ddx*forward.x + ddy*forward.y + ddz*forward.z);
            if (front > KILL_COS * Math.sqrt(d2)) { gameOver(); break; }
          }
        }
      }

      // explosion debris + flashes
      for (let i = fx.length - 1; i >= 0; i--) {
        const e = fx[i]; e.ttl--;
        if (e.type === 'flash') {
          e.obj.scale.addScalar(e.grow);
          e.obj.material.opacity = Math.max(0, e.ttl / 22);
          if (e.ttl <= 0) { scene.remove(e.obj); e.obj.material.dispose(); fx.splice(i, 1); }
        } else if (e.type === 'trail') {
          e.obj.material.opacity = Math.max(0, e.ttl / e.life) * 0.55; // fade out
          e.obj.scale.multiplyScalar(0.9);                              // shrink in place
          if (e.ttl <= 0) { scene.remove(e.obj); trailPool.push(e.obj); fx.splice(i, 1); }  // recycle, don't dispose
        } else {
          e.obj.position.x += e.vx; e.obj.position.y += e.vy; e.obj.position.z += e.vz;
          e.obj.rotation.x += e.spin; e.obj.rotation.y += e.spin;
          e.obj.scale.multiplyScalar(0.96);
          if (e.ttl <= 0) { scene.remove(e.obj); fx.splice(i, 1); }
        }
      }

      const fovTarget = boosting ? 102 : 74;
      camera.fov += (fovTarget - camera.fov) * 0.1; camera.updateProjectionMatrix();
      starMat.size += (((boosting ? 2.6 : 1.7)) - starMat.size) * 0.1;
      warpEl.classList.toggle('on', boosting);

      // wrap the star grid around the camera, then add a gentle per-star sway
      const pos = sg.attributes.position.array;
      const cx = ship.x, cy = ship.y, cz = ship.z;
      for (let i = 0; i < STAR_N; i++) {
        let bx = sbase[i*3], by = sbase[i*3+1], bz = sbase[i*3+2];
        if (bx - cx > SR) bx -= 2*SR; else if (bx - cx < -SR) bx += 2*SR;
        if (by - cy > SR) by -= 2*SR; else if (by - cy < -SR) by += 2*SR;
        if (bz - cz > SR) bz -= 2*SR; else if (bz - cz < -SR) bz += 2*SR;
        sbase[i*3]=bx; sbase[i*3+1]=by; sbase[i*3+2]=bz;
        const ph = sph[i], am = samp[i];
        pos[i*3]   = bx + Math.sin(T * 0.6 + ph) * am;
        pos[i*3+1] = by + Math.cos(T * 0.5 + ph * 1.3) * am;
        pos[i*3+2] = bz + Math.sin(T * 0.4 + ph * 0.7) * am;
      }
      sg.attributes.position.needsUpdate = true;

      // soft nebula clouds wrap around the camera
      for (const n of nebs) for (let a = 0; a < 3; a++) {
        const c = ship.getComponent(a), v = n.position.getComponent(a), dd = v - c;
        if (dd > NEB_R) n.position.setComponent(a, v - 2*NEB_R);
        else if (dd < -NEB_R) n.position.setComponent(a, v + 2*NEB_R);
      }

      // shooting stars: drift fast + fade out, with an occasional new one
      for (let i = shoots.length - 1; i >= 0; i--) {
        const s = shoots[i];
        s.mesh.position.x += s.vx*fs; s.mesh.position.y += s.vy*fs; s.mesh.position.z += s.vz*fs;
        s.ttl -= fs;
        const k = Math.max(0, s.ttl / s.life);
        for (let j = 0; j < s.mats.length; j++) s.mats[j].opacity = s.bases[j] * k;
        if (s.ttl <= 0) { scene.remove(s.mesh); for (let j = 0; j < s.mats.length; j++) s.mats[j].dispose(); shoots.splice(i, 1); }
      }
      if (Math.random() < 0.0025 * fs) spawnShootingStar();

      renderer.render(scene, camera);
    }
    tick();
  </script>
