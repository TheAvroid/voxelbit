<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voxelbit</title>
<link rel="icon" href="logo.ico">
<style>
  @font-face { font-family: 'px3'; src: url('3x3-pixel.otf') format('opentype'); }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0e12; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: fixed; top: 10px; left: 12px; color: #cfd6e0; font: 7px/1.7 'px3', Consolas, monospace; letter-spacing: 1px; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; opacity: 0.9; }
  #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; mix-blend-mode: difference; pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: #fff; }
  #cross::before { left: 0; right: 0; top: 6px; height: 2px; }
  #cross::after { top: 0; bottom: 0; left: 6px; width: 2px; }
  #lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: rgba(8,10,14,0.55); color: #e8edf4; font: 8px/1.8 'px3', Consolas, monospace; letter-spacing: 1px; cursor: pointer; text-align: center; backdrop-filter: blur(2px); }
  #lock h1 { font: 60px 'px3', Consolas, monospace; letter-spacing: 4px; margin: 0; }
  #lock h1 .tv { background: linear-gradient(180deg, #ff7a8a 0%, #8e0e20 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }   /* crimson, light→dark */
  #lock h1 .tb { background: linear-gradient(180deg, #b8ff6e 0%, #2f8a12 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }   /* lime, light→dark */
  #lock .keys { opacity: 0.75; font-size: 6px; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0e12; color: #9fb0c4; font: 9px 'px3', Consolas, monospace; letter-spacing: 2px; z-index: 10; }
  #btnRow { display: flex; gap: 10px; margin-top: 18px; justify-content: center; align-items: center; }
  #kbBtn, #pkBtn { width: 46px; height: 46px; background: rgba(18,23,31,0.85); border: 1px solid #38445a; border-radius: 12px; color: #cfd6e0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; }
  #kbBtn svg, #pkBtn svg { width: 22px; height: 22px; }
  #kbBtn:hover, #pkBtn:hover { border-color: #8fb3dd; color: #fff; }
  #todWrap { position: absolute; top: 24px; right: 28px; display: flex; gap: 12px; align-items: center; font-size: 8px; color: #cfd6e0; }
  #todSlider { width: 170px; accent-color: #7fd05a; cursor: pointer; }
  #rdWrap { position: absolute; top: 54px; right: 28px; display: flex; gap: 12px; align-items: center; font-size: 8px; color: #cfd6e0; }
  #rdSlider { width: 170px; accent-color: #7fd05a; cursor: pointer; }
  #kbPanel, #pkPanel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6,8,12,0.72); z-index: 30; }
  #kbCard, #pkCard { background: #10151c; border: 1px solid #2b3646; border-radius: 16px; padding: 22px 26px 18px; min-width: 350px; max-height: 82vh; overflow-y: auto; font: 8px/2.1 'px3', Consolas, monospace; letter-spacing: 1px; color: #dfe6ee; box-shadow: 0 12px 48px rgba(0,0,0,0.55); }
  #kbCard h2, #pkCard h2 { font: 12px 'px3', Consolas, monospace; letter-spacing: 3px; margin: 0 0 12px; color: #fff; }
  .pkRow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 5px 2px; border-bottom: 1px solid #1a212c; }
  .pkRow:last-child { border-bottom: none; }
  .pkRow input { width: 150px; accent-color: #7fd05a; cursor: pointer; }
  .pkVal { min-width: 52px; text-align: right; color: #9fd07a; }
  #pkClose, #pkReset { margin: 14px 6px 0; background: #1a2331; border: 1px solid #33405a; border-radius: 10px; padding: 7px 22px; color: #dfe6ee; cursor: pointer; font: inherit; }
  #pkClose:hover, #pkReset:hover { border-color: #8fb3dd; }
  .kbRow { display: flex; justify-content: space-between; align-items: center; gap: 34px; padding: 5px 2px; border-bottom: 1px solid #1a212c; }
  .kbRow:last-child { border-bottom: none; }
  .kbKey { min-width: 96px; text-align: center; background: #1a2331; border: 1px solid #33405a; border-radius: 9px; padding: 5px 10px; color: #cfe0f4; cursor: pointer; font: inherit; transition: border-color 0.12s; }
  .kbKey:hover { border-color: #6d8fc0; }
  .kbKey.listen { border-color: #7fd05a; color: #b8ff6e; }
  #kbClose { display: block; margin: 14px auto 0; background: #1a2331; border: 1px solid #33405a; border-radius: 10px; padding: 7px 26px; color: #dfe6ee; cursor: pointer; font: inherit; }
  #kbClose:hover { border-color: #8fb3dd; }
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(26,6,2,0.82); color: #ffd9c0; font: 9px/2 'px3', Consolas, monospace; letter-spacing: 1px; cursor: pointer; text-align: center; z-index: 25; }
  #over h1 { font: 22px 'px3', Consolas, monospace; letter-spacing: 4px; margin: 0; color: #ff6a3a; }
  #over .ohint { opacity: 0.75; font-size: 7px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross" class="hidden"></div>
<div id="hud"></div>
<div id="lock" class="hidden">
  <h1><span class="tv">voxel</span><span class="tb">bit</span></h1>
  <div>click to enter</div>
  <div id="todWrap"><span id="todLabel">08:00</span><input type="range" id="todSlider" min="0" max="1439" step="1" value="480"></div>
  <div id="rdWrap"><span id="rdLabel">view 37m</span><input type="range" id="rdSlider" min="96" max="368" step="8" value="368"></div>
  <div id="btnRow">
    <button id="kbBtn" title="keybinds"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M10 22H6v-2h4v2Zm-4-2H4v-2H2v-2h2v-2h2v6Zm6-4h10v2H12v2h-2v-6h2v2Zm-2-2H6v-2h4v2Zm8-2h-4v-2h4v2Zm-6-4H2V6h10V4h2v6h-2V8Zm8-2h2v2h-2v2h-2V4h2v2Zm-2-2h-4V2h4v2Z"/></svg></button>
    <button id="pkBtn" title="held item position"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M10 22H8v-2h2v2Zm8 0h-2v-2h2v2ZM4 18h2v2H2v-4h2v2Zm12 2h-2v-2h2v2Zm4 0h-2v-2h2v2ZM8 18H6v-2h2v2Zm6 0h-2v-2h2v2Zm8 0h-2v-2h2v2ZM6 16H4v-2h2v2Zm4 0H8v-2h2v2Zm6 0h-2v-2h2v2Zm4 0h-2v-2h2v2ZM8 14H6v-2h2v2Zm4 0h-2v-2h2v2Zm6 0h-2v-2h2v2Zm-8-2H8v-2h2v2Zm4 0h-2v-2h2v2Zm8 0h-2v-2h2v2Zm-10-2h-2V8h2v2Zm8-4h-2v2h-2v2h-2V8h-2V6h2V4h2V2h4v4ZM6 8H4V6h2v2ZM4 6H2V4h2v2Zm4 0H6V4h2v2ZM6 4H4V2h2v2Z"/></svg></button>
  </div>
</div>
<div id="kbPanel" class="hidden"><div id="kbCard">
  <h2>keybinds</h2>
  <div id="kbRows"></div>
  <button id="kbClose">done</button>
</div></div>
<div id="pkPanel" class="hidden"><div id="pkCard">
  <h2>held item</h2>
  <div id="pkRows"></div>
  <div style="text-align:center"><button id="pkReset">reset</button><button id="pkClose">done</button></div>
</div></div>
<div id="load">generating forest…</div>
<div id="over" class="hidden"><h1>game over</h1><div>you fell into the lava</div><div class="ohint">click to respawn</div></div>

<script type="module">
(async () => {
  const $ = (id) => document.getElementById(id);
  const loadEl = $('load'), lockEl = $('lock'), hudEl = $('hud'), crossEl = $('cross');
  const fail = (msg) => { loadEl.classList.remove('hidden'); loadEl.textContent = msg; throw new Error(msg); };
  const stage = async (msg) => { loadEl.textContent = msg; await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };

  // ── WebGPU init ────────────────────────────────────────────────────────────
  if (!navigator.gpu) fail('WebGPU not available — use Chrome/Edge 113+');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) fail('no WebGPU adapter');
  const SIZE384 = 768 * 768 * 384, SIZE256 = 768 * 768 * 256;   // the minimum deep world wants 226 MB; fall back gracefully
  const lim = Math.min(adapter.limits.maxStorageBufferBindingSize, adapter.limits.maxBufferSize);
  const WYpick = lim >= SIZE384 ? 384 : (lim >= SIZE256 ? 256 : 192);
  let WXZ = 768;                                       // widest window the adapter can bind: 2048 (1.5 GB) → a TRUE 100 m view radius
  if (WYpick === 384) for (const c of [2048, 1536, 1280, 1024]) if (lim >= c * c * 384) { WXZ = c; break; }
  const WBYTES = WXZ * WXZ * WYpick;
  const device = await adapter.requestDevice(WBYTES > (1 << 27) ? { requiredLimits: { maxStorageBufferBindingSize: WBYTES, maxBufferSize: Math.max(WBYTES, 268435456) } } : {});
  if (WYpick < 384 || WXZ < 2048) console.warn('[vb] adapter caps buffers at', lim, '— window', WXZ, '×', WYpick);
  device.addEventListener('uncapturederror', (e) => { console.error('[vb] gpu error:', e.error.message); });
  const canvas = $('c');
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });
  let moonTex = device.createTexture({ size: [1, 1], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
  device.queue.writeTexture({ texture: moonTex }, new Uint8Array([205, 210, 220, 255]), {}, [1, 1]);   // flat fallback if the photo is missing
  try {                                                // REAL moon — NASA SVS full-moon photograph mapped onto the disc
    const mimg = await createImageBitmap(await (await fetch('assets/moon.jpg')).blob());
    moonTex = device.createTexture({ size: [mimg.width, mimg.height], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
    device.queue.copyExternalImageToTexture({ source: mimg }, { texture: moonTex }, [mimg.width, mimg.height]);
  } catch (e) { console.warn('[vb] moon.jpg missing — flat moon disc', e); }

  // ── ENDLESS WORLD ── voxel = 10 cm. A 768×160×768 window (94 MB u8) slides with the player over an
  // infinite deterministic world. Storage is TOROIDAL: shifting the window regenerates + uploads only the
  // 8-voxel strip that wrapped — never a full-buffer move. All generation is a pure function of WORLD
  // coordinates, so strips re-materialise seamlessly and revisited terrain is always identical.
  const WX = WXZ, WY = WYpick, WZ = WXZ;              // deep world: +128 voxels of stone below the surface for TRUE gorge depth
  const LIFT = WY >= 384 ? 128 : 0;                    // terrain floats this far above bedrock
  const BX = WX >> 3, BY = WY >> 3, BZ = WZ >> 3;     // 8³ brick occupancy for empty-space skipping
  const HALF = WX >> 1;
  const W = new Uint8Array(WX * WY * WZ);             // CPU copy — collision + build (toroidal)
  const W32 = new Uint32Array(W.buffer);
  const hmap = new Int16Array(WX * WZ);               // terrain top per column (toroidal)
  const bricks = new Uint32Array((BX * BY * BZ + 31) >> 5);
  const B2X = BX >> 2, B2Y = BY >> 2, B2Z = BZ >> 2;  // L2 occupancy: 32-voxel SUPER-bricks — long rays leap 32 voxels through open air
  const bricks2 = new Uint32Array((B2X * B2Y * B2Z + 31) >> 5);
  const touched = new Uint8Array(BX * BZ);             // per 8×8 column tile: has this memory EVER been written? virgin tiles skip air-clearing (~40% of a column)
  let winOX = 0, winOZ = 0;                            // world coord of the window corner (multiples of 8)
  const rect = { xlo: 0, xhi: 0, zlo: 0, zhi: 0 };     // the fully-GENERATED world rectangle (8-aligned) — only terrain inside it is ever traced
  const gwrap = (v, n) => ((v % n) + n) % n;
  let SPWX = 384, SPWZ = 384;                          // world spawn — nudged east at boot if it lands in a lake

  // deterministic integer hash — the shader ports this bit-for-bit for the far-field terrain
  const ihash = (x, z) => { let h = (Math.imul(x, 374761393) + Math.imul(z, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const ROCKSTEP = Math.imul(57, 374761393);           // Δ of the inlined rock-shade hash per +1 y (x advances by 57)
  const sstep = (t) => t * t * (3 - 2 * t);
  const vnoise = (x, z) => { const ix = Math.floor(x), iz = Math.floor(z), fx = sstep(x - ix), fz = sstep(z - iz);
    return (ihash(ix, iz) * (1 - fx) + ihash(ix + 1, iz) * fx) * (1 - fz) + (ihash(ix, iz + 1) * (1 - fx) + ihash(ix + 1, iz + 1) * fx) * fz; };
  const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.13 + 11.7, z * 2.13 + 5.3) * 0.27 + vnoise(x * 4.41 + 41.2, z * 4.41 + 23.8) * 0.18;
  const HMAX = Math.min(105 + LIFT, WY - 122);         // terrain ceiling
  const WL = 24 + LIFT;                                // GLOBAL water level — water is simply terrain below this line
  const baseH = (x, z) => {
    const b = 8 + LIFT + 88 * fbm(x * 0.008, z * 0.008);
    const shoreK = Math.min(1, Math.abs(b - WL) / 12);   // fine detail fades out near the waterline — smooth, beach-like entries into water
    return Math.min(HMAX, Math.max(4 + LIFT, Math.round(b + 9 * fbm(x * 0.04 + 7.3, z * 0.04 + 2.1) * (0.2 + 0.8 * shoreK))));
  };
  const basinM = (x, z) => {                           // huge, rare low-frequency basins pull the land under the waterline (threshold halved — lakes are rarer)
    const b = vnoise(x * 0.0016 + 313.7, z * 0.0016 + 157.3);
    if (b >= 0.065) return 0;
    return sstep(Math.min(1, (0.065 - b) / 0.06));
  };
  const H = (x, z) => {
    let h = baseH(x, z);
    const bm = basinM(x, z);
    const m = bm * Math.max(0, Math.min(1, (66 + LIFT - h) / 20));   // basins only form in low country
    if (m > 0) h = Math.round(h - m * (h - Math.max(6, LIFT - 40)) + (ihash(x * 13 + 7, z * 17 + 3) - 0.5) * 0.8);   // gently dithered — no terrace banding
    const rs = riverS(x, z);
    if (rs > 0.02) h = Math.min(h, Math.round(h * (1 - rs) + (WL - 2 - 26 * rs) * rs + (ihash(x * 19 + 5, z * 23 + 9) - 0.5) * 0.8));   // deep + gently dithered banks
    if (h <= WL && h >= WL - 5 && bm <= 0.25 && rs <= 0.04) h = WL + 1;   // shallow pockets — including BASIN-RIM dips — become beach; only true lake cores hold water
    return h;
  };
  const RIVCELL = 768, RIVINF = 2100;                  // RIVERS — one candidate per ~77 m cell, 40% roll, LONG sweeping channels
  const rivCache = new Map();
  function riverAt(cx, cz) {
    const key = cx * 100003 + cz;
    let R = rivCache.get(key);
    if (R !== undefined) return R;
    R = null;
    if (ihash(cx * 83 + 19, cz * 89 + 7) <= 0.10) {    // halved — rivers are rarer
      R = { sx: cx * RIVCELL + 100 + ihash(cx * 3 + 61, cz * 7 + 23) * (RIVCELL - 200),
            sz: cz * RIVCELL + 100 + ihash(cx * 9 + 47, cz * 5 + 83) * (RIVCELL - 200),
            ang: ihash(cx + 15, cz + 92) * Math.PI,
            len: 1000 + ihash(cx * 11 + 6, cz * 13 + 31) * 800,
            wb: 72 + ihash(cx * 17 + 8, cz * 19 + 2) * 64,
            seed: cx * 571 + cz * 769 };
      const ex = R.sx + Math.cos(R.ang) * R.len, ez = R.sz + Math.sin(R.ang) * R.len;
      const pad = R.wb * 1.4 + 46;
      R.x0 = Math.min(R.sx, ex) - pad; R.x1 = Math.max(R.sx, ex) + pad;
      R.z0 = Math.min(R.sz, ez) - pad; R.z1 = Math.max(R.sz, ez) + pad;
    }
    rivCache.set(key, R);
    return R;
  }
  const rivEval = (R, x, z) => {                       // channel strength contribution of ONE river at this column
    if (x < R.x0 || x > R.x1 || z < R.z0 || z > R.z1) return 0;   // bbox fast reject — rivers are long now
    const dxr = Math.cos(R.ang), dzr = Math.sin(R.ang);
    const t = Math.max(0, Math.min(R.len, (x - R.sx) * dxr + (z - R.sz) * dzr));
    const off = Math.sin(t * 0.015 + R.seed) * 30 + Math.sin(t * 0.04 + R.seed * 1.7) * 10;   // broad meanders
    const pd = (x - (R.sx + dxr * t)) * (-dzr) + (z - (R.sz + dzr * t)) * dxr;
    const k = Math.pow(Math.sin(Math.PI * t / R.len), 0.35);
    const w = R.wb * k * 1.4;
    const d = Math.abs(pd - off);
    return d < w ? sstep(1 - d / w) : 0;
  };
  let rivScope = null;                                 // bulk-gen fast path: the rivers relevant to a region, gathered ONCE — not a 49-cell scan per column
  function gatherRivers(x0, x1, z0, z1) {
    const list = [];
    for (let jz = Math.floor((z0 - RIVINF) / RIVCELL); jz <= Math.floor((z1 + RIVINF) / RIVCELL); jz++)
      for (let jx = Math.floor((x0 - RIVINF) / RIVCELL); jx <= Math.floor((x1 + RIVINF) / RIVCELL); jx++) {
        const R = riverAt(jx, jz); if (R) list.push(R);
      }
    return { x0, x1, z0, z1, list };
  }
  function riverS(x, z) {                              // channel strength 0..1 at this column
    let best = 0;
    if (rivScope && x >= rivScope.x0 && x < rivScope.x1 && z >= rivScope.z0 && z < rivScope.z1) {
      for (const R of rivScope.list) { const v = rivEval(R, x, z); if (v > best) best = v; }
      return best;
    }
    for (let jz = Math.floor((z - RIVINF) / RIVCELL); jz <= Math.floor((z + RIVINF) / RIVCELL); jz++)
      for (let jx = Math.floor((x - RIVINF) / RIVCELL); jx <= Math.floor((x + RIVINF) / RIVCELL); jx++) {
        const R = riverAt(jx, jz); if (!R) continue;
        const v = rivEval(R, x, z); if (v > best) best = v;
      }
    return best;
  }
  const groundMin = (x, z, r) => Math.min(H(x, z), H(x - r, z), H(x + r, z), H(x, z - r), H(x, z + r));   // lowest ground under a footprint — nothing floats on slopes

  // ── ROW-CACHED noise ── the bulk fill sweeps rows (fixed wz, ascending wx), so every vnoise stream's z-lattice
  // pair is row-constant and its x-corners only change every 1/scale columns. These samplers return BIT-IDENTICAL
  // values to vnoise/fbm/H (same float expressions, same ihash corners) at ~1 amortized hash per column instead of ~40.
  function rowNoise(zArg) {
    const iz = Math.floor(zArg), fz = sstep(zArg - iz);
    let ix = 0x7fffffff, h00 = 0, h10 = 0, h01 = 0, h11 = 0;
    return (xArg) => {
      const nix = Math.floor(xArg);
      if (nix !== ix) {
        if (nix === ix + 1) { h00 = h10; h01 = h11; h10 = ihash(nix + 1, iz); h11 = ihash(nix + 1, iz + 1); }
        else { h00 = ihash(nix, iz); h10 = ihash(nix + 1, iz); h01 = ihash(nix, iz + 1); h11 = ihash(nix + 1, iz + 1); }
        ix = nix;
      }
      const fx = sstep(xArg - ix);
      return (h00 * (1 - fx) + h10 * fx) * (1 - fz) + (h01 * (1 - fx) + h11 * fx) * fz;
    };
  }
  function makeHRow(wz) {                              // H(x, wz) specialized for one row — every float op mirrors H exactly
    const zb = wz * 0.008;
    const s1 = rowNoise(zb), s2 = rowNoise(zb * 2.13 + 5.3), s3 = rowNoise(zb * 4.41 + 23.8);
    const zd = wz * 0.04 + 2.1;
    const d1 = rowNoise(zd), d2 = rowNoise(zd * 2.13 + 5.3), d3 = rowNoise(zd * 4.41 + 23.8);
    const bsr = rowNoise(wz * 0.0016 + 157.3);
    return (wx) => {
      const xb = wx * 0.008;
      const b = 8 + LIFT + 88 * (s1(xb) * 0.55 + s2(xb * 2.13 + 11.7) * 0.27 + s3(xb * 4.41 + 41.2) * 0.18);
      const shoreK = Math.min(1, Math.abs(b - WL) / 12);
      const xd = wx * 0.04 + 7.3;
      let h = Math.min(HMAX, Math.max(4 + LIFT, Math.round(b + 9 * (d1(xd) * 0.55 + d2(xd * 2.13 + 11.7) * 0.27 + d3(xd * 4.41 + 41.2) * 0.18) * (0.2 + 0.8 * shoreK))));
      const b0 = bsr(wx * 0.0016 + 313.7);
      const bm = b0 >= 0.065 ? 0 : sstep(Math.min(1, (0.065 - b0) / 0.06));
      const m = bm * Math.max(0, Math.min(1, (66 + LIFT - h) / 20));
      if (m > 0) h = Math.round(h - m * (h - Math.max(6, LIFT - 40)) + (ihash(wx * 13 + 7, wz * 17 + 3) - 0.5) * 0.8);
      const rs = riverS(wx, wz);
      if (rs > 0.02) h = Math.min(h, Math.round(h * (1 - rs) + (WL - 2 - 26 * rs) * rs + (ihash(wx * 19 + 5, wz * 23 + 9) - 0.5) * 0.8));
      if (h <= WL && h >= WL - 5 && bm <= 0.25 && rs <= 0.04) h = WL + 1;
      return h;
    };
  }
  function makeMossRow(wz) {                           // fillColumn's moss fbm, row-specialized (exact)
    const zm = wz * 0.031 + 17.2;

      let px = vec2<f32>(f32(gid.x) + 0.5 + u.jit.x, f32(gid.y) + 0.5 + u.jit.y);
      let rd = rayDir(px);
      let ro = u.camPos;                                             // window-relative
      let skipW = (u32(u.fx) & 2u) != 0u;                            // camera underwater → water voxels are see-through
      let tcap = u.rdist.x / max(length(vec2<f32>(rd.x, rd.z)), 0.05);   // CIRCULAR render distance (slider) — the world ends at a radius, not a square edge
      var h = trace(ro, rd, min(4000.0, tcap), skipW);

      var sunV = 0.0; var skyV = 0.0;
      if (h.t >= 0.0) {

        let pos = ro + rd * t;

            let g2 = 2.0 * pow(0.5 + 0.5 * sin(wxw * -0.048 + wzw * 0.104 + u.time * 0.80), 2.0) - 1.0;  // crossing secondary swell
            let wv = g1 * 1.3 + g2 * 0.9 + sin((wxw * 0.9 + wzw * 0.63) * 0.23 - u.time * 1.9) * 0.35;   // + short wind chop
            let wh = baseTop + floor(wv + 0.5);

            if (ro.y + rd.y * tNext <= wh) { t = (wh - ro.y) / rd.y; wCrest = wv; whF = wh; break; }     // TOP face within this column
            if (tmx < tmz) { tq = tmx; tmx += 1.0 / adx; cw.x += i32(sx2); }

          }

            albedo = pal[h.vox].rgb * (0.90 + 0.20 * ivhash(vcW2));                       // grain follows the WAVE voxel, not the flat plane
            if (wSide) { albedo *= 0.74; }                                                // darker step sides give the swell its silhouette
            var foam = 0.0;                                                                       // no mid-water whitecaps — foam only rings the shoreline
            let ci = vec3<i32>(i32(floor(hp.x)), i32(baseTop - 0.5), i32(floor(hp.z)));
            for (var s2 = 0; s2 < 8; s2++) {                                              // probes at ±2 AND ±4 → a surf band twice as thick
              var nb = ci;
              let pr = select(2, 4, s2 >= 4);
              let a2 = s2 & 3;
              if (a2 == 0) { nb.x += pr; } else if (a2 == 1) { nb.x -= pr; } else if (a2 == 2) { nb.z += pr; } else { nb.z -= pr; }
              let nv = voxAt(nb);
              if (nv != 0u && nv != WTv && nv != WBv) {                                   // churned SURF ring wherever water meets land
                foam = max(foam, step(0.35, ivhash(ci + vec3<i32>(s2 * 13, 11, 5)) * (0.55 + 0.45 * sin(u.time * 1.6 + f32(ci.x * 7 + ci.z * 5) * 0.7))));

            if (foam > 0.5) { t = min(t, (whF + 1.0 - ro.y) / rd.y); }                    // foam voxels RISE a step above the surface
            foamK = clamp(foam, 0.0, 1.0) * 0.8;
            albedo = mix(albedo, vec3<f32>(0.82, 0.87, 0.90), foamK);

        }
        if (faceId == 6u) {                                          // 20% TRANSLUCENT water — the bed shows through, fading with depth
          let bh = trace(ro + rd * (h.t + 0.01), rd, 48.0, true);    // beyond 48 voxels the mix is <5% of 20% — invisible, so don't pay for it
          if (bh.t >= 0.0) {
            let bpos = ro + rd * (h.t + 0.01) + rd * bh.t;
            let bvc = vec3<i32>(floor(bpos - bh.n * 0.01)) + vec3<i32>(i32(u.winO.x), 0, i32(u.winO.y));
            let ca = caust(floor(vec2<f32>(bpos.x + u.winO.x, bpos.z + u.winO.y)) + vec2<f32>(0.5));   // per-voxel caustic web on the bed
            let balb = pal[bh.vox].rgb * (0.88 + 0.24 * ivhash(bvc)) * (1.0 + 1.6 * ca * smoothstep(-0.02, 0.12, u.sunDir.y));
            albedo = mix(albedo, balb, 0.20 * exp(-bh.t * 0.03) * (1.0 - foamK));
          }
        }
        var seed = ((gid.x * 1973u) ^ (gid.y * 9277u) ^ (u32(u.frame) * 26699u)) | 1u;
        let sp = pos + h.n * 0.02;
        if (dot(h.n, u.sunDir) > 0.0 && u.sunDir.y > -0.04) {        // cone-jittered sun ray; skipped entirely at night
          let st = onbT(u.sunDir); let sb = cross(u.sunDir, st);
          let sdir = normalize(u.sunDir + st * ((rand(&seed) * 2.0 - 1.0) * 0.028) + sb * ((rand(&seed) * 2.0 - 1.0) * 0.028));
          let sh = trace(sp, sdir, 1200.0, skipW);
          sunV = select(1.0, 0.0, sh.t >= 0.0);
        }
        if (h.t < 500.0) {
          for (var k = 0; k < 2; k++) {                              // Teardown AO: distance before collision ≈ indirect light
            let d = cosHemi(h.n, &seed);
            let ah = trace(sp, d, 24.0, skipW);
            skyV += select(1.0, clamp(ah.t / 24.0, 0.0, 1.0), ah.t >= 0.0);
          }
          skyV *= 0.5;
        } else { skyV = 0.85; }                                      // past 50 m AO detail is sub-pixel — flat ambient, two rays saved per far pixel
      }
      var lavaG = 0u;                                                  // soft light cast by nearby lava — deterministic probe, no flicker
      // lava only exists at bedrock (y ≤ 8) and the probe reaches 18 down — pixels above y 28 can NEVER see glow, so 99.9% of pixels skip a whole ray
      if (t >= 0.0 && faceId != 8u && faceId != 7u && (ro.y + rd.y * t) < 28.0) {
        let pos2 = ro + rd * t + h.n * 0.02;
        let dh = trace(pos2, vec3<f32>(0.0, -1.0, 0.0), 18.0, true);
        if (dh.t >= 0.0 && (dh.vox == LVT || dh.vox == LVB || dh.vox == LVR || dh.vox == LVY)) {
          lavaG = u32(clamp((1.0 - dh.t / 18.0) * 14.0 + 0.5, 0.0, 14.0));
        }
      }
      textureStore(gAlbedo, vec2<i32>(gid.xy), vec4<f32>(sqrt(albedo), (f32(faceId) + f32(lavaG) * 16.0) / 255.0));
      textureStore(gIrr, vec2<i32>(gid.xy), vec4<f32>(sunV, skyV, t, 0.0));
    }
  `;

  // strip scatter — copies a repacked 8-voxel X-strip from staging into its strided home in the world buffer
  const SCATTER = /* wgsl */`
    struct SP { g0 : u32, pad0 : u32, pad1 : u32, pad2 : u32 }
    @group(0) @binding(0) var<uniform> sp : SP;
    @group(0) @binding(1) var<storage, read> stag : array<u32>;
    @group(0) @binding(2) var<storage, read_write> world : array<u32>;
    @compute @workgroup_size(256)
    fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
      let i = gid.x;
      if (i >= ${STRIPW}u) { return; }
      let r = i >> 1u; let sxw = i & 1u;
      let z = r / ${WY}u; let y = r % ${WY}u;
      world[(sp.g0 >> 2u) + sxw + y * ${WX >> 2}u + z * ${(WX * WY) >> 2}u] = stag[i];
    }
  `;

  const TEMPORAL = /* wgsl */`
    @group(0) @binding(1) var gIrr : texture_2d<f32>;
    @group(0) @binding(2) var histPrev : texture_2d<f32>;
    @group(0) @binding(3) var samp : sampler;
    @group(0) @binding(4) var histOut : texture_storage_2d<rgba16float, write>;
    @compute @workgroup_size(8, 8)
    fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
      if (gid.x >= u32(u.res.x) || gid.y >= u32(u.res.y)) { return; }
      let cur = textureLoad(gIrr, vec2<i32>(gid.xy), 0);
      if (cur.b < 0.0) { textureStore(histOut, vec2<i32>(gid.xy), vec4<f32>(0.0, 0.0, -1.0, 0.0)); return; }
      let px = vec2<f32>(f32(gid.x) + 0.5 + u.jit.x, f32(gid.y) + 0.5 + u.jit.y);
      let wp = u.camPos + rayDir(px) * cur.b;
      let uv = prevUVd(wp - u.pPos);
      var hist = 1.0;
      var acc = cur.rg;
      if (u.reset < 0.5 && uv.x > 0.001 && uv.y > 0.001 && uv.x < 0.999 && uv.y < 0.999) {
        let prev = textureSampleLevel(histPrev, samp, uv, 0.0);
        let expT = length(wp - u.pPos);
        if (prev.b > 0.0 && abs(prev.b - expT) < 0.02 * expT + 1.5) {
          hist = min(prev.a + 1.0, u.maxHist);
          acc = mix(prev.rg, cur.rg, 1.0 / hist);
        }
      }
      textureStore(histOut, vec2<i32>(gid.xy), vec4<f32>(acc, cur.b, hist));
    }
  `;

  const SPATIAL = /* wgsl */`
    @group(0) @binding(1) var hist : texture_2d<f32>;
    @group(0) @binding(2) var gAlbedo : texture_2d<f32>;
    @group(0) @binding(3) var irrOut : texture_storage_2d<rgba16float, write>;
    @compute @workgroup_size(8, 8)
    fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
      if (gid.x >= u32(u.res.x) || gid.y >= u32(u.res.y)) { return; }

      if (c.b < 0.0) { textureStore(irrOut, vec2<i32>(gid.xy), c); return; }
      let faceC = u32(textureLoad(gAlbedo, vec2<i32>(gid.xy), 0).a * 255.0 + 0.5) & 15u;
      var P = array<vec2<f32>, 12>(
        vec2<f32>(-0.326, -0.406), vec2<f32>(-0.840, -0.074), vec2<f32>(-0.696, 0.457), vec2<f32>(-0.203, 0.621),
        vec2<f32>(0.962, -0.195), vec2<f32>(0.473, -0.480), vec2<f32>(0.519, 0.767), vec2<f32>(0.185, -0.893),
        vec2<f32>(0.507, 0.064), vec2<f32>(0.896, 0.412), vec2<f32>(-0.322, -0.933), vec2<f32>(-0.792, -0.598));
      let radius = mix(8.0, 1.5, clamp(c.a / 32.0, 0.0, 1.0));
      var sum = c.rg; var wsum = 1.0;
      for (var i = 0; i < 12; i++) {

        if (q.x < 0 || q.y < 0 || q.x >= i32(u.res.x) || q.y >= i32(u.res.y)) { continue; }
        let s = textureLoad(hist, q, 0);
        let f2 = u32(textureLoad(gAlbedo, q, 0).a * 255.0 + 0.5) & 15u;
        if (s.b <= 0.0 || f2 != faceC || abs(s.b - c.b) > 0.04 * c.b + 2.0) { continue; }
        let w = exp(-2.0 * dot(P[i], P[i]));

      textureStore(irrOut, vec2<i32>(gid.xy), vec4<f32>(sum / wsum, c.b, c.a));

  `;

  const COMPOSITE = /* wgsl */`
    @group(0) @binding(1) var gAlbedo : texture_2d<f32>;
    @group(0) @binding(2) var irrF : texture_2d<f32>;

      let a = mix(ih3(i.x, i.y, i.z), ih3(i.x + 1, i.y, i.z), w.x);
      let b = mix(ih3(i.x, i.y, i.z + 1), ih3(i.x + 1, i.y, i.z + 1), w.x);
      let c = mix(ih3(i.x, i.y + 1, i.z), ih3(i.x + 1, i.y + 1, i.z), w.x);
      let d = mix(ih3(i.x, i.y + 1, i.z + 1), ih3(i.x + 1, i.y + 1, i.z + 1), w.x);

    fn cloudDen(p : vec3<f32>) -> f32 {                              // cumulus deck between y 480–800, wind-drifted

      let rd = rayDir(px);

      let face = u32(alb4.a * 255.0 + 0.5) & 15u;

          let t1c = (800.0 - camY) / rd.y;

          let tb = min(max(t0c, t1c), 12000.0);

    const fwd = [Math.sin(P.yaw) * cp, sp, Math.cos(P.yaw) * cp];
    const right = [Math.cos(P.yaw), 0, -Math.sin(P.yaw)];
    const up = [-Math.sin(P.yaw) * sp, cp, -Math.cos(P.yaw) * sp];
    const cam = [P.x, smoothEye, P.z];                 // no bob — dead-steady camera
    if (!locked) {                                     // ESC menu: the whole CAMERA drifts gently — the entire image sways
      const ts = now * 0.001;
      cam[0] += Math.sin(ts * 0.42) * 0.9;
      cam[1] += Math.sin(ts * 0.61 + 1.7) * 0.55;
      cam[2] += Math.cos(ts * 0.37) * 0.9;
    }
    const tanH = Math.tan(FOV / 2), aspect = RW / RH;
    const j = JIT[frame & 7];

    // ── uniforms ──
    const set3 = (o, v3, w) => { UF[o] = v3[0]; UF[o + 1] = v3[1]; UF[o + 2] = v3[2]; UF[o + 3] = w; };
    set3(0, [cam[0] - winOX, cam[1], cam[2] - winOZ], tanH);
    set3(4, right, aspect); set3(8, up, frame); set3(12, fwd, now / 1000);
    set3(16, [prevCam.pos[0] - winOX, prevCam.pos[1], prevCam.pos[2] - winOZ], prevCam.tanH);
    set3(20, prevCam.right, prevCam.aspect);
    const uw = waterAt(Math.floor(cam[0]), Math.floor(cam[1]), Math.floor(cam[2]));
    set3(24, prevCam.up, (cycleSpeed > 4 && !cyclePause) ? 10 : 64); set3(28, prevCam.fwd, (godRays ? 1 : 0) + (uw ? 2 : 0) + (moonMode ? 8 : 0));
    set3(32, sun, resetHist);
    UF[36] = RW; UF[37] = RH; UF[38] = j[0]; UF[39] = j[1];
    UF[40] = prevCam.jit[0]; UF[41] = prevCam.jit[1]; UF[42] = CW; UF[43] = CH;
    UF[44] = winOX; UF[45] = winOZ; UF[46] = gwrap(winOX, WX); UF[47] = gwrap(winOZ, WZ);
    { if (mouse0 && locked && !dead && now - swingStart >= 300) swingStart = now;   // hold left click → continuous swinging
      const swK = Math.min(1, (now - swingStart) / 300);
      const sw = swK < 1 ? Math.sin(swK * Math.PI) : 0;              // SWING envelope: chop forward-down, then spring back
      const hcfg = heldCfg(heldIt() || 1);             // the shown item's OWN pose (during a grab flight this is the grabbed item's)
      const cy = Math.cos(hcfg.yaw + 0.35 * sw), sy = Math.sin(hcfg.yaw + 0.35 * sw), cp2 = Math.cos(hcfg.pitch + 1.5 * sw), sp2 = Math.sin(hcfg.pitch + 1.5 * sw), cr2 = Math.cos(hcfg.roll), sr2 = Math.sin(hcfg.roll);
      // R = Rx(pitch)·Ry(yaw)·Rz(roll) — pitch OUTERMOST, so the gimbal singularity sits at yaw ±90°, far from the default pose (all three sliders stay distinct)
      let hx = hcfg.x - 0.10 * sw, hy = hcfg.y - 0.14 * sw, hz = hcfg.z + 0.16 * sw;
      const spd2 = Math.hypot(P.hvx, P.hvz);           // view-model BOB — phase tied to distance walked (smooth at any speed), amplitude eased in/out
      bobAmp += ((P.onGround && !P.fly ? Math.min(1, spd2 / WALK) : 0) - bobAmp) * (1 - Math.exp(-8 * dt));
      bobPh += spd2 * dt * 0.225;                      // slower phase + wide sweep = long smooth strides
      hx += Math.sin(bobPh) * 0.075 * bobAmp + Math.sin(now * 0.0013) * 0.0023 + Math.sin(now * 0.00073 + 1.7) * 0.0013;       // + idle breathing sway
      hy += -Math.abs(Math.cos(bobPh)) * 0.028 * bobAmp + Math.sin(now * 0.0017 + 0.9) * 0.0023 + Math.sin(now * 0.00091) * 0.0012;
      let AX = [cr2 * cy, sr2 * cp2 + cr2 * sy * sp2, sr2 * sp2 - cr2 * sy * cp2];
      let AY = [-sr2 * cy, cr2 * cp2 - sr2 * sy * sp2, cr2 * sp2 + sr2 * sy * cp2];
      let AZ = [sy, -cy * sp2, cy * cp2];
      let showId = dead ? 0 : (slots[selSlot] ? slots[selSlot].it : 0);          // held item = the SELECTED hand slot (0 = empty hand)
      if (grabAnim) {                                  // FLY-TO-HAND — glide from the world spot into the held pose (angular size matches at k=0, so no pop)
        const k = Math.min(1, (now - grabAnim.t0) / 340);
        const e2 = k * k * (3 - 2 * k);
        const rx = grabAnim.x - cam[0], ry = grabAnim.y - cam[1], rz = grabAnim.z - cam[2];
        const sxc = (rx * right[0] + ry * right[1] + rz * right[2]) * hcfg.scale;
        const syc = (rx * up[0] + ry * up[1] + rz * up[2]) * hcfg.scale;
        const szc = (rx * fwd[0] + ry * fwd[1] + rz * fwd[2]) * hcfg.scale;
        hx = sxc + (hx - sxc) * e2; hy = syc + (hy - syc) * e2; hz = szc + (hz - szc) * e2;
        const ca3 = Math.cos(grabAnim.aPh), sa3 = Math.sin(grabAnim.aPh);       // spin orientation (world) expressed in the camera basis, slerped into the held pose
        const q = qslerp(m2q([ca3 * right[0] + sa3 * right[2], ca3 * up[0] + sa3 * up[2], ca3 * fwd[0] + sa3 * fwd[2]],
                             [sa3 * right[0] - ca3 * right[2], sa3 * up[0] - ca3 * up[2], sa3 * fwd[0] - ca3 * fwd[2]],   // Y = Z×X — matches the (right-handed) hover frame
                             [right[1], up[1], fwd[1]]),
                         m2q(AX, AY, AZ), e2);
        const M = q2m(q); AX = M[0]; AY = M[1]; AZ = M[2];
        showId = dead ? 0 : grabAnim.it;
        if (k >= 1) { addItem(grabAnim.it); grabAnim = null; }
      }
      set3(48, [hx, hy, hz], hcfg.scale);
      set3(52, AX, showId);
      set3(56, AY, 0);
      set3(60, AZ, 0);
    }
    UF[64] = Math.max(64, Math.min(renderDist,           // the view never reaches past the GENERATED rect — outrunning gen shrinks it smoothly
      P.x - rect.xlo - 12, rect.xhi - P.x - 12, P.z - rect.zlo - 12, rect.zhi - P.z - 12));
    UF[65] = 0; UF[66] = 0; UF[67] = 0;
    for (let di = 0; di < 4; di++) {                   // dropped items → camera space (voxel units), hovering + spinning (+ launch flight out of the hand)
      const o2 = 68 + di * 16, dr = drops[di];
      if (!dr) { UF[o2 + 7] = 0; continue; }
      const a2 = now * 0.0012 + dr.ph, ca2 = Math.cos(a2), sa2 = Math.sin(a2);
      let px3 = dr.x + 0.5, py3 = dr.y + 5.5 + Math.sin(now * 0.002 + dr.ph) * 1.3, pz3 = dr.z + 0.5;
      let Xw = [ca2, 0, sa2], Yw = [sa2, 0, -ca2], Zw = [0, 1, 0];   // RIGHT-handed (Y = Z×X) — an improper frame here turns into a bogus quat mid-flight
      const tE = (now - dr.born) / 1000;
      if (dr.T && tE < dr.T + 0.22) {
        const spinQ = m2q(Xw, Yw, Zw);
        if (tE < dr.T) {                               // ballistic TOSS: exact parabola from the hand — NO tumble, it keeps its hand
          const k = tE / dr.T;                         // orientation and eases UPRIGHT into the hover pose (user: no wobbling)
          px3 = dr.sx + dr.vx * tE; py3 = dr.sy + dr.vy * tE + 0.5 * TOSS_G * tE * tE; pz3 = dr.sz + dr.vz * tE;
          const M = q2m(qslerp(dr.q0, spinQ, k * k * (3 - 2 * k)));
          Xw = M[0]; Yw = M[1]; Zw = M[2];
        } else {                                       // touchdown: ease the arc endpoint into the hover bob
          const e2 = (tE - dr.T) / 0.22, e3 = e2 * e2 * (3 - 2 * e2);
          px3 = dr.ex + (px3 - dr.ex) * e3; py3 = dr.ey + (py3 - dr.ey) * e3; pz3 = dr.ez + (pz3 - dr.ez) * e3;
        }
      }
      const rx = px3 - cam[0], ry = py3 - cam[1], rz = pz3 - cam[2];
      UF[o2] = rx * right[0] + ry * right[1] + rz * right[2]; UF[o2 + 1] = rx * up[0] + ry * up[1] + rz * up[2]; UF[o2 + 2] = rx * fwd[0] + ry * fwd[1] + rz * fwd[2]; UF[o2 + 3] = 1.0;
      UF[o2 + 4] = Xw[0] * right[0] + Xw[1] * right[1] + Xw[2] * right[2]; UF[o2 + 5] = Xw[0] * up[0] + Xw[1] * up[1] + Xw[2] * up[2]; UF[o2 + 6] = Xw[0] * fwd[0] + Xw[1] * fwd[1] + Xw[2] * fwd[2]; UF[o2 + 7] = dr.it;
      UF[o2 + 8] = Yw[0] * right[0] + Yw[1] * right[1] + Yw[2] * right[2]; UF[o2 + 9] = Yw[0] * up[0] + Yw[1] * up[1] + Yw[2] * up[2]; UF[o2 + 10] = Yw[0] * fwd[0] + Yw[1] * fwd[1] + Yw[2] * fwd[2]; UF[o2 + 11] = 0;
      UF[o2 + 12] = Zw[0] * right[0] + Zw[1] * right[1] + Zw[2] * right[2]; UF[o2 + 13] = Zw[0] * up[0] + Zw[1] * up[1] + Zw[2] * up[2]; UF[o2 + 14] = Zw[0] * fwd[0] + Zw[1] * fwd[1] + Zw[2] * fwd[2]; UF[o2 + 15] = 0;
    }
    device.queue.writeBuffer(uniBuf, 0, UF);

    // ── passes ──
    const par = frame & 1;
    const enc = device.createCommandEncoder();
    if (xStripPending >= 0) {                          // strip scatter runs before this frame's trace
      const p = enc.beginComputePass(); p.setPipeline(pScatter); p.setBindGroup(0, bgScatter);
      p.dispatchWorkgroups(Math.ceil(STRIPW / 256)); p.end();
      xStripPending = -1;
    }
    const gw = Math.ceil(RW / 8), gh = Math.ceil(RH / 8);
    const run = (pipe, bg) => { const p = enc.beginComputePass(); p.setPipeline(pipe); p.setBindGroup(0, bg); p.dispatchWorkgroups(gw, gh); p.end(); };
    run(pTrace, bgTrace);
    run(pTemporal, bgTemporal[par]);
    run(pSpatial, bgSpatial[par]);
    run(pComposite, bgComposite);
    run(pTaa, bgTaa[par]);
    const rp = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    rp.setPipeline(pBlit); rp.setBindGroup(0, bgBlit[par]); rp.draw(3); rp.end();
    device.queue.submit([enc.finish()]);

    // ── save prev cam (world coords) ──
    prevCam.pos = cam; prevCam.right = right; prevCam.up = up; prevCam.fwd = fwd;
    prevCam.tanH = tanH; prevCam.aspect = aspect; prevCam.jit = j;
    resetHist = 0;
    frame++;

    // ── hud ──
    hudT += dt;
    if (hudT > 0.25) {
      hudT = 0;
      if (!locked) {
        const mins = Math.floor(tday * 1440);
        todLabel.textContent = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
        if (!todDrag) todSlider.value = mins;
      }
      hudEl.textContent = `${fpsEma.toFixed(0)} fps${vsyncOn ? '' : ' (uncapped)'}  ${RW}×${RH} (${renderScale.toFixed(2)}×)\n` +
        `xyz ${(P.x / 10).toFixed(1)} ${(P.y / 10).toFixed(1)} ${(P.z / 10).toFixed(1)} m${P.fly ? '  FLY' : ''}${P.crouch ? '  crouch' : ''}  ${String(Math.floor(tday * 24)).padStart(2, '0')}:${String(Math.floor((tday * 24 % 1) * 60)).padStart(2, '0')}${cycleSpeed !== 1 ? ' x' + cycleSpeed.toFixed(1) : ''}${cyclePause ? ' paused' : ''}` +
        `\n${slots.map((s, i) => { const nm = s ? ({ 1: 'axe', 2: 'rock', 3: 'twig' })[s.it] + (s.n > 1 ? '×' + s.n : '') : '·'; return i === selSlot ? `[${nm}]` : ` ${nm} `; }).join(' ')}`;
    }
    // V-SYNC OFF: pace frames off the PREVIOUS frame's GPU completion — up to 2 frames in flight, so the
    // CPU's frame prep (worldgen slices, uniforms, JS) overlaps GPU execution instead of serializing with it.
    // When frames get expensive (long view distances), drop to same-frame pacing — pipelining latency reads as input LAG there.
    if (vsyncOn || document.hidden) { paceWaited = false; requestAnimationFrame(tick); }   // hidden tab always idles via rAF
    else { const wait = gpuPrevDone; gpuPrevDone = device.queue.onSubmittedWorkDone(); const ts = performance.now();   // ONE pacing mode — no threshold flip-flop, so gen throughput is CONSISTENT
      wait.then(() => { waitEma += (Math.min(30, performance.now() - ts) - waitEma) * 0.08; paceWaited = true; tick(performance.now()); }); }
  }
  tick(performance.now());
})();
</script>
