<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voxelbit</title>
<link rel="icon" href="logo.ico">
<style>
  @font-face { font-family: 'px3'; src: url('3x3-pixel.otf') format('opentype'); }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0e12; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: fixed; top: 10px; left: 12px; color: #cfd6e0; font: 7px/1.7 'px3', Consolas, monospace; letter-spacing: 1px; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; opacity: 0.9; }
  #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; mix-blend-mode: difference; pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: #fff; }
  #cross::before { left: 0; right: 0; top: 6px; height: 2px; }
  #cross::after { top: 0; bottom: 0; left: 6px; width: 2px; }
  #clashHint { position: fixed; left: 50%; top: 57%; transform: translateX(-50%); color: #fff; font: 10px/1.6 'px3', Consolas, monospace; letter-spacing: 2px; text-shadow: 0 1px 3px #000; pointer-events: none; opacity: 0.85; }
  #achv { position: fixed; left: 50%; top: calc(50% - 350px); transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.9s ease; font-family: 'px3', Consolas, monospace; text-shadow: 0 1px 3px #000; }
  #achv .a1 { font-size: 14px; letter-spacing: 6px; color: #ffd76a; }
  #achv .a2 { font-size: 26px; letter-spacing: 4px; color: #fff; margin-top: 10px; }
  #lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: rgba(8,10,14,0.55); color: #e8edf4; font: 8px/1.8 'px3', Consolas, monospace; letter-spacing: 1px; cursor: pointer; text-align: center; backdrop-filter: blur(2px); }
  #lock h1 { font: 60px 'px3', Consolas, monospace; letter-spacing: 4px; margin: 0; }
  #lock h1 .tv { background: linear-gradient(180deg, #ff7a8a 0%, #8e0e20 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }   /* crimson, light→dark */
  #lock h1 .tb { background: linear-gradient(180deg, #b8ff6e 0%, #2f8a12 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }   /* lime, light→dark */
  #lock .keys { opacity: 0.75; font-size: 6px; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0e12; color: #9fb0c4; font: 9px 'px3', Consolas, monospace; letter-spacing: 2px; z-index: 10; }
  #btnRow { display: flex; gap: 10px; margin-top: 18px; justify-content: center; align-items: center; }
  #kbBtn, #pkBtn, #edBtn { width: 46px; height: 46px; background: rgba(18,23,31,0.85); border: 1px solid #38445a; border-radius: 12px; color: #cfd6e0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; }
  #kbBtn svg, #pkBtn svg, #edBtn svg { width: 22px; height: 22px; }
  #kbBtn:hover, #pkBtn:hover, #edBtn:hover { border-color: #8fb3dd; color: #fff; }
  #edBtn.on { border-color: #7fd05a; color: #b8ff6e; }
  #edRow { display: flex; flex-direction: column; gap: 10px; align-items: center; }   /* stacked under the button row, centred on it; #lock's own 10px gap matches the square-button spacing */
  #edRow button { background: #1a2331; border: 1px solid #33405a; border-radius: 9px; padding: 4px 16px; color: #cfe0f4; cursor: pointer; font: inherit; }
  #edRow button:hover { border-color: #6d8fc0; }
  #edHud { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); color: #cfe0f4; font: 9px/1.8 'px3', Consolas, monospace; letter-spacing: 1px; text-shadow: 0 1px 3px #000; pointer-events: none; text-align: center; }
  #todWrap { position: absolute; top: 24px; right: 28px; display: flex; gap: 12px; align-items: center; font-size: 8px; color: #cfd6e0; }
  #todSlider { width: 170px; accent-color: #7fd05a; cursor: pointer; }
  #rdWrap { position: absolute; top: 54px; right: 28px; display: flex; gap: 12px; align-items: center; font-size: 8px; color: #cfd6e0; }
  #rdSlider { width: 170px; accent-color: #7fd05a; cursor: pointer; }
  #volWrap { position: absolute; top: 84px; right: 28px; display: flex; gap: 12px; align-items: center; font-size: 8px; color: #cfd6e0; }
  #volSlider { width: 170px; accent-color: #7fd05a; cursor: pointer; }
  #snowWrap { position: absolute; top: 114px; right: 28px; display: flex; gap: 12px; align-items: center; font-size: 8px; color: #cfd6e0; }
  #snowBtn { background: #1a2331; border: 1px solid #33405a; border-radius: 9px; padding: 4px 16px; color: #cfe0f4; cursor: pointer; font: inherit; }
  #snowBtn:hover { border-color: #6d8fc0; }
  #snowBtn.on { border-color: #7fd05a; color: #b8ff6e; }
  #kbPanel, #pkPanel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6,8,12,0.72); z-index: 30; }
  #kbCard, #pkCard { background: #10151c; border: 1px solid #2b3646; border-radius: 16px; padding: 22px 26px 18px; min-width: 350px; max-height: 82vh; overflow-y: auto; font: 8px/2.1 'px3', Consolas, monospace; letter-spacing: 1px; color: #dfe6ee; box-shadow: 0 12px 48px rgba(0,0,0,0.55); }
  #kbCard h2, #pkCard h2 { font: 12px 'px3', Consolas, monospace; letter-spacing: 3px; margin: 0 0 12px; color: #fff; }
  .pkRow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 5px 2px; border-bottom: 1px solid #1a212c; }
  .pkRow:last-child { border-bottom: none; }
  .pkRow input { width: 150px; accent-color: #7fd05a; cursor: pointer; }
  .pkVal { min-width: 52px; text-align: right; color: #9fd07a; }
  #pkClose, #pkReset { margin: 14px 6px 0; background: #1a2331; border: 1px solid #33405a; border-radius: 10px; padding: 7px 22px; color: #dfe6ee; cursor: pointer; font: inherit; }
  #pkClose:hover, #pkReset:hover { border-color: #8fb3dd; }
  .kbRow { display: flex; justify-content: space-between; align-items: center; gap: 34px; padding: 5px 2px; border-bottom: 1px solid #1a212c; }
  .kbRow:last-child { border-bottom: none; }
  .kbKey { min-width: 96px; text-align: center; background: #1a2331; border: 1px solid #33405a; border-radius: 9px; padding: 5px 10px; color: #cfe0f4; cursor: pointer; font: inherit; transition: border-color 0.12s; }
  .kbKey:hover { border-color: #6d8fc0; }
  .kbKey.listen { border-color: #7fd05a; color: #b8ff6e; }
  #kbClose { display: block; margin: 14px auto 0; background: #1a2331; border: 1px solid #33405a; border-radius: 10px; padding: 7px 26px; color: #dfe6ee; cursor: pointer; font: inherit; }
  #kbClose:hover { border-color: #8fb3dd; }
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(26,6,2,0.82); color: #ffd9c0; font: 9px/2 'px3', Consolas, monospace; letter-spacing: 1px; cursor: pointer; text-align: center; z-index: 25; }
  #over h1 { font: 22px 'px3', Consolas, monospace; letter-spacing: 4px; margin: 0; color: #ff6a3a; }
  #over .ohint { opacity: 0.75; font-size: 7px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross" class="hidden"></div>
<div id="clashHint" class="hidden">shift + left click</div>
<div id="achv"><div class="a1">discovery</div><div class="a2">sharp edge</div></div>
<div id="hud"></div>
<div id="lock" class="hidden">
  <h1><span class="tv">voxel</span><span class="tb">bit</span></h1>
  <div>click to enter</div>
  <div id="todWrap"><span id="todLabel">08:00</span><input type="range" id="todSlider" min="0" max="1439" step="1" value="480"></div>
  <div id="rdWrap"><span id="rdLabel">view 37m</span><input type="range" id="rdSlider" min="96" max="368" step="8" value="368"></div>
  <div id="volWrap"><span id="volLabel">volume 100%</span><input type="range" id="volSlider" min="0" max="100" step="1" value="100"></div>
  <div id="snowWrap"><span>snow</span><button id="snowBtn">off</button></div>
  <div id="btnRow">
    <button id="kbBtn" title="keybinds"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M10 22H6v-2h4v2Zm-4-2H4v-2H2v-2h2v-2h2v6Zm6-4h10v2H12v2h-2v-6h2v2Zm-2-2H6v-2h4v2Zm8-2h-4v-2h4v2Zm-6-4H2V6h10V4h2v6h-2V8Zm8-2h2v2h-2v2h-2V4h2v2Zm-2-2h-4V2h4v2Z"/></svg></button>
    <button id="pkBtn" title="held item position"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M10 22H8v-2h2v2Zm8 0h-2v-2h2v2ZM4 18h2v2H2v-4h2v2Zm12 2h-2v-2h2v2Zm4 0h-2v-2h2v2ZM8 18H6v-2h2v2Zm6 0h-2v-2h2v2Zm8 0h-2v-2h2v2ZM6 16H4v-2h2v2Zm4 0H8v-2h2v2Zm6 0h-2v-2h2v2Zm4 0h-2v-2h2v2ZM8 14H6v-2h2v2Zm4 0h-2v-2h2v2Zm6 0h-2v-2h2v2Zm-8-2H8v-2h2v2Zm4 0h-2v-2h2v2Zm8 0h-2v-2h2v2Zm-10-2h-2V8h2v2Zm8-4h-2v2h-2v2h-2V8h-2V6h2V4h2V2h4v4ZM6 8H4V6h2v2ZM4 6H2V4h2v2Zm4 0H6V4h2v2ZM6 4H4V2h2v2Z"/></svg></button>
    <button id="edBtn" title="asset editor"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M14 4h4v2h-4zm-4-2h4v2h-4zM6 8h4v2H6zm0 10h4v2H6zm4-8h4v2h-4zm0 10h4v2h-4zm4-12h4v2h-4zm0 10h4v2h-4zM6 4h4v2H6zM2 6h4v2H2zm0 10h4v2H2zM18 6h4v2h-4zm0 10h4v2h-4z"/><path d="M2 6h2v12H2zm18 0h2v12h-2zm-8 6h2v8h-2z"/></svg></button>
  </div>
  <div id="edRow" class="hidden"><button id="edImport">import asset (.vox)</button><button id="edExport">export sequence</button><input id="edFile" type="file" accept=".vox" multiple style="display:none"></div>
</div>
<div id="edHud" class="hidden"></div>
<div id="kbPanel" class="hidden"><div id="kbCard">
  <h2>keybinds</h2>
  <div id="kbRows"></div>
  <button id="kbClose">done</button>
</div></div>
<div id="pkPanel" class="hidden"><div id="pkCard">
  <h2>held item</h2>
  <div id="pkRows"></div>
  <div style="text-align:center"><button id="pkReset">reset</button><button id="pkClose">done</button></div>
</div></div>
<div id="load">generating forest…</div>
<div id="over" class="hidden"><h1>game over</h1><div>you fell into the lava</div><div class="ohint">click to respawn</div></div>

<script type="module">
(async () => {
  const $ = (id) => document.getElementById(id);
  const loadEl = $('load'), lockEl = $('lock'), hudEl = $('hud'), crossEl = $('cross');
  const fail = (msg) => { loadEl.classList.remove('hidden'); loadEl.textContent = msg; throw new Error(msg); };
  const stage = async (msg) => { loadEl.textContent = msg; await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };

  // ── WebGPU init ────────────────────────────────────────────────────────────
  if (!navigator.gpu) fail('WebGPU not available — use Chrome/Edge 113+');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) fail('no WebGPU adapter');
  const SIZE384 = 768 * 768 * 384, SIZE256 = 768 * 768 * 256;   // the minimum deep world wants 226 MB; fall back gracefully
  const lim = Math.min(adapter.limits.maxStorageBufferBindingSize, adapter.limits.maxBufferSize);
  const WYpick = lim >= SIZE384 ? 384 : (lim >= SIZE256 ? 256 : 192);
  let WXZ = 768;                                       // widest window the adapter can bind: 2048 (1.5 GB) → a TRUE 100 m view radius
  if (WYpick === 384) for (const c of [2048, 1536, 1280, 1024]) if (lim >= c * c * 384) { WXZ = c; break; }
  const WBYTES = WXZ * WXZ * WYpick;
  const PROF = adapter.features.has('timestamp-query');   // per-pass GPU timing (dev __vb.prof(); harmless when unread)
  const device = await adapter.requestDevice({
    ...(WBYTES > (1 << 27) ? { requiredLimits: { maxStorageBufferBindingSize: WBYTES, maxBufferSize: Math.max(WBYTES, 268435456) } } : {}),
    ...(PROF ? { requiredFeatures: ['timestamp-query'] } : {}) });
  if (WYpick < 384 || WXZ < 2048) console.warn('[vb] adapter caps buffers at', lim, '— window', WXZ, '×', WYpick);
  device.addEventListener('uncapturederror', (e) => { console.error('[vb] gpu error:', e.error.message); });
  const canvas = $('c');
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });
  let moonTex = device.createTexture({ size: [1, 1], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
  device.queue.writeTexture({ texture: moonTex }, new Uint8Array([205, 210, 220, 255]), {}, [1, 1]);   // flat fallback if the photo is missing
  try {                                                // REAL moon — NASA SVS full-moon photograph mapped onto the disc
    const mimg = await createImageBitmap(await (await fetch('assets/moon.jpg')).blob());
    moonTex = device.createTexture({ size: [mimg.width, mimg.height], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
    device.queue.copyExternalImageToTexture({ source: mimg }, { texture: moonTex }, [mimg.width, mimg.height]);
  } catch (e) { console.warn('[vb] moon.jpg missing — flat moon disc', e); }

  // ── ENDLESS WORLD ── voxel = 10 cm. A 768×160×768 window (94 MB u8) slides with the player over an
  // infinite deterministic world. Storage is TOROIDAL: shifting the window regenerates + uploads only the
  // 8-voxel strip that wrapped — never a full-buffer move. All generation is a pure function of WORLD
  // coordinates, so strips re-materialise seamlessly and revisited terrain is always identical.
  const WX = WXZ, WY = WYpick, WZ = WXZ;              // deep world: +128 voxels of stone below the surface for TRUE gorge depth
  const LIFT = WY >= 384 ? 128 : 0;                    // terrain floats this far above bedrock
  const BX = WX >> 3, BY = WY >> 3, BZ = WZ >> 3;     // 8³ brick occupancy for empty-space skipping
  const HALF = WX >> 1;
  const W = new Uint8Array(WX * WY * WZ);             // CPU copy — collision + build (toroidal)
  const W32 = new Uint32Array(W.buffer);
  const hmap = new Int16Array(WX * WZ);               // terrain top per column (toroidal)
  const bricks = new Uint32Array((BX * BY * BZ + 31) >> 5);
  const B2X = BX >> 2, B2Y = BY >> 2, B2Z = BZ >> 2;  // L2 occupancy: 32-voxel SUPER-bricks — long rays leap 32 voxels through open air
  const bricks2 = new Uint32Array((B2X * B2Y * B2Z + 31) >> 5);
  const touched = new Uint8Array(BX * BZ);             // per 8×8 column tile: has this memory EVER been written? virgin tiles skip air-clearing (~40% of a column)
  let winOX = 0, winOZ = 0;                            // world coord of the window corner (multiples of 8)
  const rect = { xlo: 0, xhi: 0, zlo: 0, zhi: 0 };     // the fully-GENERATED world rectangle (8-aligned) — only terrain inside it is ever traced
  const gwrap = (v, n) => ((v % n) + n) % n;
  let SPWX = 384, SPWZ = 384;                          // world spawn — nudged east at boot if it lands in a lake

  // deterministic integer hash — the shader ports this bit-for-bit for the far-field terrain
  const ihash = (x, z) => { let h = (Math.imul(x, 374761393) + Math.imul(z, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const ROCKSTEP = Math.imul(57, 374761393);           // Δ of the inlined rock-shade hash per +1 y (x advances by 57)
  const sstep = (t) => t * t * (3 - 2 * t);
  const vnoise = (x, z) => { const ix = Math.floor(x), iz = Math.floor(z), fx = sstep(x - ix), fz = sstep(z - iz);
    return (ihash(ix, iz) * (1 - fx) + ihash(ix + 1, iz) * fx) * (1 - fz) + (ihash(ix, iz + 1) * (1 - fx) + ihash(ix + 1, iz + 1) * fx) * fz; };
  const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.13 + 11.7, z * 2.13 + 5.3) * 0.27 + vnoise(x * 4.41 + 41.2, z * 4.41 + 23.8) * 0.18;
  const HMAX = Math.min(105 + LIFT, WY - 122);         // terrain ceiling
  const WL = 24 + LIFT;                                // GLOBAL water level — water is simply terrain below this line
  const baseH = (x, z) => {
    const b = 8 + LIFT + 88 * fbm(x * 0.008, z * 0.008);
    const shoreK = Math.min(1, Math.abs(b - WL) / 12);   // fine detail fades out near the waterline — smooth, beach-like entries into water
    return Math.min(HMAX, Math.max(4 + LIFT, Math.round(b + 9 * fbm(x * 0.04 + 7.3, z * 0.04 + 2.1) * (0.2 + 0.8 * shoreK))));
  };
  const basinM = (x, z) => {                           // huge, rare low-frequency basins pull the land under the waterline (threshold halved — lakes are rarer)
    const b = vnoise(x * 0.0016 + 313.7, z * 0.0016 + 157.3);
    if (b >= 0.065) return 0;
    return sstep(Math.min(1, (0.065 - b) / 0.06));
  };
  const H = (x, z) => {
    let h = baseH(x, z);
    const bm = basinM(x, z);
    const m = bm * Math.max(0, Math.min(1, (66 + LIFT - h) / 20));   // basins only form in low country
    if (m > 0) h = Math.round(h - m * (h - Math.max(6, LIFT - 40)) + (ihash(x * 13 + 7, z * 17 + 3) - 0.5) * 0.8);   // gently dithered — no terrace banding
    const rs = riverS(x, z);
    const bn = fbm(x * 0.05 + 13.7, z * 0.05 + 4.2);   // bed/beach relief — lakebeds and sand flats are no longer billiard-flat
    if (rs > 0.02) h = Math.min(h, Math.round(h * (1 - rs) + (WL - 2 - 26 * rs) * rs + (bn - 0.5) * 9 * Math.min(1, rs * 2.2) + (ihash(x * 19 + 5, z * 23 + 9) - 0.5) * 0.8));   // noisy bed + gently dithered banks
    if (h <= WL && h >= WL - 5 && bm <= 0.25 && rs <= 0.04) h = WL + 1 + Math.max(0, Math.round((bn - 0.55) * 5));   // beach flats get 0-2 voxel dune relief
    return h;
  };
  const RIVCELL = 768, RIVINF = 6200;                  // WATERSHEDS — one candidate per ~77 m cell, rare roll; each hit is a whole dendritic system (influence radius must cover the longest possible chain)
  const rivCache = new Map();
  function riverAt(cx, cz) {                           // builds a WATERSHED: 1-3 tributaries join a main stem at confluences, the stem widens downstream
    const key = cx * 100003 + cz;                      // into a BIG reservoir lake, and ~half the reservoirs spill an OUTLET river that ends in a smaller tail lake.
    let R = rivCache.get(key);                         // R = { segs: [{sx,sz,dxr,dzr,len,wb,seed,t0,t1}], lakes: [{x,z,r,seed}], bbox }
    if (R !== undefined) return R;
    R = null;
    if (ihash(cx * 83 + 19, cz * 89 + 7) <= 0.035) {   // rarer than the old isolated segments — water stays scarce, but every occurrence is a connected system
      const hx = cx * RIVCELL + 100 + ihash(cx * 3 + 61, cz * 7 + 23) * (RIVCELL - 200);   // headwater of the main stem
      const hz = cz * RIVCELL + 100 + ihash(cx * 9 + 47, cz * 5 + 83) * (RIVCELL - 200);
      const ang = ihash(cx + 15, cz + 92) * Math.PI;
      const dxr = Math.cos(ang), dzr = Math.sin(ang);
      const Lm = 1800 + ihash(cx * 11 + 6, cz * 13 + 31) * 800;    // main stem 180-260 m
      const wbM = 58 + ihash(cx * 17 + 8, cz * 19 + 2) * 42;
      const seed = cx * 571 + cz * 769;
      const mx = hx + dxr * Lm, mz = hz + dzr * Lm;
      const segs = [{ sx: hx, sz: hz, dxr, dzr, len: Lm, wb: wbM, seed, t0: 0.6, t1: 1.15 }];   // the stem WIDENS downstream like a real river
      const lakes = [{ x: mx, z: mz, r: 200 + ihash(cx * 31 + 9, cz * 37 + 5) * 100, seed }];   // the reservoir it feeds
      const nT = 1 + ((ihash(cx * 7 + 44, cz * 3 + 18) * 2.99) | 0);
      for (let i = 0; i < nT; i++) {                   // TRIBUTARIES — branch back-and-out from a confluence on the stem, narrowing toward their heads
        const f = 0.25 + ihash(cx * 13 + i * 17, cz * 11 + i * 23) * 0.55;
        const jx = hx + dxr * (Lm * f), jz = hz + dzr * (Lm * f);
        const side = ihash(cx * 5 + i * 31, cz * 29 + i * 7) < 0.5 ? 1 : -1;
        const ta = ang + Math.PI + side * (0.4 + ihash(cx * 19 + i * 3, cz * 41 + i * 13) * 0.55);
        const tl = 600 + ihash(cx * 23 + i * 29, cz * 17 + i * 37) * 800;
        const tdx = Math.cos(ta), tdz = Math.sin(ta);
        segs.push({ sx: jx, sz: jz, dxr: tdx, dzr: tdz, len: tl, wb: wbM * 0.55, seed: seed + 97 * (i + 1), t0: 1.0, t1: 0.55 });
        if (ihash(cx * 37 + i * 5, cz * 43 + i * 11) < 0.4)        // some tributaries rise from a small HEADWATER POND
          lakes.push({ x: jx + tdx * tl, z: jz + tdz * tl, r: 55 + ihash(cx * 47 + i * 7, cz * 53 + i * 3) * 45, seed: seed + 31 * (i + 1) });
      }
      if (ihash(cx * 61 + 13, cz * 59 + 27) < 0.55) {  // OUTLET — the reservoir FEEDS a downstream river that ends in a smaller tail lake
        const oa = ang + (ihash(cx * 67 + 5, cz * 71 + 9) - 0.5) * 1.0;

          var rdD = vec3<f32>(dot(dc3, dXv.xyz), dot(dc3, dYv.xyz), dot(dc3, dZv.xyz));
          if (abs(rdD.x) < 1e-6) { rdD.x = 1e-6; }
          if (abs(rdD.y) < 1e-6) { rdD.y = 1e-6; }
          if (abs(rdD.z) < 1e-6) { rdD.z = 1e-6; }
          let invD = 1.0 / rdD;
          let taD = -roD * invD;
          let tbD = (vec3<f32>(f32(eW), f32(eD), f32(eH)) - roD) * invD;

          let istD = vec3<i32>(sign(rdD));

          var iMapD = eOff + vcD.x + vcD.y * eW + vcD.z * eW * eD;   // running flat index — one add per DDA step
          for (var i = 0; i < PICKSTEPS; i++) {
            let cell = ITEMMAP[u32(iMapD)];
            if (cell.w > 0.5) {

                var nl = vec3<f32>(0.0);
                if (vaxD == 0) { nl.x = -f32(istD.x); } else if (vaxD == 1) { nl.y = -f32(istD.y); } else { nl.z = -f32(istD.z); }
                let nc = dXv.xyz * nl.x + dYv.xyz * nl.y + dZv.xyz * nl.z;
                let nw = u.right * nc.x + u.up * nc.y + u.fwd * nc.z;
                if (di == 4 || di >= 9) {                            // the CARDINAL + ALL WORLD CREATURES incl. worms + lily pads — the EXACT world surface model (shadowed sun + sky + bounce + fog)
                  let behind = col;                                  // scene color behind this creature — the translucent wing blend needs it
                  var sunC = 0.0;                                    // REAL sun occlusion: a creature under the canopy sits in tree shade exactly like the ground below it
                  if (${location.search.includes('noshadow') ? 0 : 1} == 1 && dot(nw, u.sunDir) > 0.0 && u.sunDir.y > -0.04) {   // (deterministic un-jittered ray, no denoiser in the path — none of the irr-coupling translucency/shimmer; ?noshadow disables for A/B)

                  let skyIrr = mix(HORIZON, ZENITH, 0.5 + 0.5 * nw.y) * 0.95 * dayScale();
                  let bounceC = BOUNCE * clamp(0.55 - 0.55 * nw.y, 0.0, 1.0) * max(u.sunDir.y, 0.0) * 2.2 * select(1.0, 0.12, isMoon());
                  var alb2 = cell.rgb;                                 // DUCK EYE BLINK: the black eye voxel flashes the head-GREEN when the slot's blink lane (dYv.w) is lit (user)
                  if (${DUCK_ITEM0 > 0 ? 1 : 0} == 1 && dYv.w > 0.5 && (dit == ${DUCK_ITEM0 || 9999} || dit == ${DUCKB_ITEM0 || 9998}) && alb2.r < 0.02 && alb2.g < 0.02 && alb2.b < 0.02) { alb2 = vec3<f32>(${DUCK_GREEN[0].toFixed(4)}, ${DUCK_GREEN[1].toFixed(4)}, ${DUCK_GREEN[2].toFixed(4)}); }

                } else {                                             // dropped items keep the flat raw-palette look

            }

            else { tHit = vNxD.z; vNxD.z += abs(invD.z); vcD.z += istD.z; iMapD += istD.z * eW * eD; vaxD = 2; }

      if (ITEMN > 0) {                                             // HELD ITEMS — RIGHT hand + LEFT hand (dual-wield rocks) as TRUE 3D voxels, DDA-walked in camera space; the nearer hand wins overlaps

        let ndc2 = (px / u.res) * 2.0 - 1.0;

                    heldT = tCur * vs;

                    if (vax == 0) { nl.x = -f32(istep.x); } else if (vax == 1) { nl.y = -f32(istep.y); } else { nl.z = -f32(istep.z); }

                    let skyIrr = mix(HORIZON, ZENITH, 0.5 + 0.5 * nw.y) * 0.95 * dayScale();   // grain is ±12% per voxel and scrambles hand-authored .vox gradients (~5% steps on the axe handle)
                    let bounce = BOUNCE * clamp(0.55 - 0.55 * nw.y, 0.0, 1.0) * max(u.sunDir.y, 0.0) * 2.2 * select(1.0, 0.12, isMoon());   // warm ground bounce on side/under faces — without it side faces are sky-only (cool + dark), the axe handle read grey-brown

  const TAA = /* wgsl */`
    @group(0) @binding(1) var colorCur : texture_2d<f32>;
    @group(0) @binding(2) var gIrr : texture_2d<f32>;
    @group(0) @binding(3) var colorPrev : texture_2d<f32>;
    @group(0) @binding(4) var samp : sampler;
    @group(0) @binding(5) var colorHistOut : texture_storage_2d<rgba8unorm, write>;
    @compute @workgroup_size(8, 8)
    fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
      if (gid.x >= u32(u.res.x) || gid.y >= u32(u.res.y)) { return; }

      let cur = textureLoad(colorCur, p, 0).rgb;
      var mn = cur; var mx = cur;
      for (var dy = -1; dy <= 1; dy++) { for (var dx = -1; dx <= 1; dx++) {
        let q = clamp(p + vec2<i32>(dx, dy), vec2<i32>(0), vec2<i32>(i32(u.res.x) - 1, i32(u.res.y) - 1));
        let s = textureLoad(colorCur, q, 0).rgb;
        mn = min(mn, s); mx = max(mx, s);
      } }
      let px = vec2<f32>(f32(gid.x) + 0.5 + u.jit.x, f32(gid.y) + 0.5 + u.jit.y);
      let rd = rayDir(px);
      let t = textureLoad(gIrr, p, 0).b;
      var d = rd;
      if (t > 0.0) { d = (u.camPos + rd * t) - u.pPos; }
      let uv = prevUVd(d);
      var outc = cur;
      if (u.reset < 0.5 && uv.x > 0.001 && uv.y > 0.001 && uv.x < 0.999 && uv.y < 0.999) {
        let prev = clamp(textureSampleLevel(colorPrev, samp, uv, 0.0).rgb, mn, mx);
        outc = mix(prev, cur, 0.12);
      }
      textureStore(colorHistOut, vec2<i32>(gid.xy), vec4<f32>(outc, select(0.0, 1.0, t < 0.0)));   // alpha = SKY mask → only the sky/sun feed the god-ray scatter in the blit
    }
  `;

  const BLIT = /* wgsl */`
    @group(0) @binding(1) var src : texture_2d<f32>;
    @group(0) @binding(2) var samp : sampler;
    @vertex fn vs(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4<f32> {
      var P = array<vec2<f32>, 3>(vec2<f32>(-1.0, -3.0), vec2<f32>(3.0, 1.0), vec2<f32>(-1.0, 1.0));
      return vec4<f32>(P[vi], 0.0, 1.0);
    }
    @fragment fn fs(@builtin(position) fc : vec4<f32>) -> @location(0) vec4<f32> {
      let uv = fc.xy / u.canvasRes;
      var col = textureSampleLevel(src, samp, uv, 0.0).rgb;

      // Bright near-white SKY pixels scatter (alpha = sky mask from the TAA pass); voxels block → shafts.
      let sf = dot(u.sunDir, u.fwd);
      let dayK = clamp(u.sunDir.y * 3.0, 0.0, 1.0);
      if (sf > 0.05 && dayK > 0.0 && (u32(u.fx) & 1u) != 0u) {
        let sunNDC = vec2<f32>(dot(u.sunDir, u.right) / (sf * u.tanH * u.aspect), dot(u.sunDir, u.up) / (sf * u.tanH));
        let sunPix = vec2<f32>((sunNDC.x * 0.5 + 0.5) * u.canvasRes.x, (0.5 - sunNDC.y * 0.5) * u.canvasRes.y);
        var sp = fc.xy;
        let delta = (sunPix - sp) * (0.7 / 24.0);                  // rays reach ~70% of the way to the sun
        sp += delta * fract(52.9829189 * fract(0.06711056 * fc.x + 0.00583715 * fc.y));   // per-pixel start jitter (IGN) — without it the 24 discrete taps ghost bright edges (the cloud deck) into evenly-spaced banded stripes when the sun is far off-screen
        var glow = vec3<f32>(0.0);
        var decay = 1.0;
        for (var i = 0; i < 24; i++) {
          sp += delta;
          let suv = sp / u.canvasRes;
          if (suv.x > 0.0 && suv.y > 0.0 && suv.x < 1.0 && suv.y < 1.0) {
            let s4 = textureSampleLevel(src, samp, suv, 0.0);
            let b = max(s4.r, max(s4.g, s4.b));
            let white = min(s4.r, min(s4.g, s4.b)) / max(b, 0.001);   // 1 = white (the sun disc/halo), low = saturated sky
            glow += s4.rgb * (smoothstep(0.86, 1.0, b) * smoothstep(0.45, 0.8, white) * s4.a * decay);   // only the disc + corona scatter — bright clouds no longer wash a FOG veil over the view
          }
          decay *= 0.96;
        }
        col += glow * (0.055 * dayK) * select(vec3<f32>(1.0, 0.93, 0.78), vec3<f32>(0.55, 0.65, 1.0) * 1.1, isMoon());   // strong warm sun shafts / cool MOON RAYS — the rays, not the fog
        // ── LENS FLARE: ghosts along the sun→centre axis + streak + bloom, gated by on-screen sun visibility
        var sv = 0.0;
        for (var fy = -1; fy <= 1; fy++) { for (var fxx = -1; fxx <= 1; fxx++) {
          let s5 = textureSampleLevel(src, samp, (sunPix + vec2<f32>(f32(fxx), f32(fy)) * 6.0) / u.canvasRes, 0.0);
          sv += s5.a * smoothstep(0.72, 0.94, max(s5.r, max(s5.g, s5.b)));
        } }
        sv /= 9.0;
        if (sv > 0.02) {
          let ctr = u.canvasRes * 0.5;
          let axis = ctr - sunPix;
          var K = array<f32, 4>(0.35, 0.65, 1.15, 1.7);
          var TINT = array<vec3<f32>, 4>(vec3<f32>(1.0, 0.85, 0.6), vec3<f32>(0.6, 1.0, 0.75), vec3<f32>(0.65, 0.75, 1.0), vec3<f32>(1.0, 0.7, 0.85));
          for (var gi = 0; gi < 4; gi++) {
            let gp = sunPix + axis * (1.0 + K[gi]);
            let rr = u.canvasRes.y * (0.014 + 0.030 * K[gi]);
            col += TINT[gi] * smoothstep(rr, rr * 0.22, length(fc.xy - gp)) * 0.10 * sv * dayK;   // doubled — bold flare ghosts
          }
        }
      }
      return vec4<f32>(col, 1.0);
    }
  `;

  const mkCompute = (code) => device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code: PRE + code }), entryPoint: 'main' } });

      profStg.mapAsync(GPUMapMode.READ).then(() => {
        const q = new BigInt64Array(profStg.getMappedRange());
        for (let i = 0; i < 5; i++) { const ms = Number(q[i * 2 + 1] - q[i * 2]) / 1e6; if (ms >= 0 && ms < 100) profEma[i] = profEma[i] * 0.92 + ms * 0.08; }
        profStg.unmap(); profBusy = false;
      }).catch(() => { profBusy = false; });
    }

    // ── save prev cam (world coords) ──
    prevCam.pos = cam; prevCam.right = right; prevCam.up = up; prevCam.fwd = fwd;
    prevCam.tanH = tanH; prevCam.aspect = aspect; prevCam.jit = j;
    resetHist = 0;
    frame++;

    // ── dual-wield overlays ── the shift+left-click hint shows until the discovery is earned
    if (achHideT && now > achHideT) { achEl.style.opacity = 0; achHideT = 0; }
    clashHintEl.classList.toggle('hidden', !(locked && !vbAch.sharpEdge && dualRocks() && now - clashT0 > 620));

    // ── hud ──
    hudT += dt;
    if (hudT > 0.25) {
      hudT = 0;
      if (!locked) {
        const mins = Math.floor(tday * 1440);
        todLabel.textContent = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
        if (!todDrag) todSlider.value = mins;
      }
      hudEl.textContent = `${fpsEma.toFixed(0)} fps${vsyncOn ? '' : ' (uncapped)'}  ${RW}×${RH} (${renderScale.toFixed(2)}×)\n` +
        `xyz ${(P.x / 10).toFixed(1)} ${(P.y / 10).toFixed(1)} ${(P.z / 10).toFixed(1)} m${P.fly ? '  FLY' : ''}${P.crouch ? '  crouch' : ''}  ${String(Math.floor(tday * 24)).padStart(2, '0')}:${String(Math.floor((tday * 24 % 1) * 60)).padStart(2, '0')}${cycleSpeed !== 1 ? ' x' + cycleSpeed.toFixed(1) : ''}${cyclePause ? ' paused' : ''}` +
        `\n${slots.map((s, i) => { const nm = s ? (ITEM_NAMES[s.it] || '?') + (s.n > 1 ? '×' + s.n : '') : '·'; return i === selSlot ? `[${nm}]` : ` ${nm} `; }).join(' ')}`;
    }
    // V-SYNC OFF: pace frames off the PREVIOUS frame's GPU completion — up to 2 frames in flight, so the
    // CPU's frame prep (worldgen slices, uniforms, JS) overlaps GPU execution instead of serializing with it.
    // When frames get expensive (long view distances), drop to same-frame pacing — pipelining latency reads as input LAG there.
    if (vsyncOn || document.hidden) { paceWaited = false; requestAnimationFrame(tick); }   // hidden tab always idles via rAF
    else { const wait = gpuPrevDone; gpuPrevDone = device.queue.onSubmittedWorkDone(); const ts = performance.now();   // ONE pacing mode — no threshold flip-flop, so gen throughput is CONSISTENT
      wait.then(() => { waitEma += (Math.min(30, performance.now() - ts) - waitEma) * 0.08; paceWaited = true; tick(performance.now()); }); }
  }
  tick(performance.now());
})();
</script>
