<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voxelbit — engine</title>
<link rel="icon" href="logo.ico">
<style>
  @font-face { font-family: 'px3'; src: url('3x3-pixel.otf') format('opentype'); }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0e12; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: fixed; top: 10px; left: 12px; color: #cfd6e0; font: 7px/1.7 'px3', Consolas, monospace; letter-spacing: 1px; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; opacity: 0.9; }
  #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; mix-blend-mode: difference; pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: #fff; }
  #cross::before { left: 0; right: 0; top: 6px; height: 2px; }
  #cross::after { top: 0; bottom: 0; left: 6px; width: 2px; }
  #lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: rgba(8,10,14,0.55); color: #e8edf4; font: 8px/1.8 'px3', Consolas, monospace; letter-spacing: 1px; cursor: pointer; text-align: center; backdrop-filter: blur(2px); }
  #lock h1 { font: 20px 'px3', Consolas, monospace; letter-spacing: 3px; margin: 0; color: #fff; text-shadow: 0 2px 12px #000; }
  #lock .keys { opacity: 0.75; font-size: 6px; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0e12; color: #9fb0c4; font: 9px 'px3', Consolas, monospace; letter-spacing: 2px; z-index: 10; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross" class="hidden"></div>
<div id="hud"></div>
<div id="lock" class="hidden">
  <h1>VOXELBIT</h1>
  <div>click to enter</div>
  <div class="keys">WASD move &nbsp;·&nbsp; SHIFT sprint &nbsp;·&nbsp; SPACE jump/swim &nbsp;·&nbsp; C crouch &nbsp;·&nbsp; RIGHT-CLICK pick up twigs+pebbles &nbsp;·&nbsp; F fly &nbsp;·&nbsp; L sun orbit &nbsp;·&nbsp; G god rays &nbsp;·&nbsp; V v-sync &nbsp;·&nbsp; [ ] render scale &nbsp;·&nbsp; R respawn</div>
</div>
<div id="load">generating forest…</div>

<script type="module">
(async () => {
  const $ = (id) => document.getElementById(id);
  const loadEl = $('load'), lockEl = $('lock'), hudEl = $('hud'), crossEl = $('cross');
  const fail = (msg) => { loadEl.classList.remove('hidden'); loadEl.textContent = msg; throw new Error(msg); };
  const stage = async (msg) => { loadEl.textContent = msg; await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };

  // ── WebGPU init ────────────────────────────────────────────────────────────
  if (!navigator.gpu) fail('WebGPU not available — use Chrome/Edge 113+');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) fail('no WebGPU adapter');
  const BIG = 768 * 768 * 256;                        // 151 MB world buffer wants a raised binding limit (default is 128 MiB)
  const canBig = adapter.limits.maxStorageBufferBindingSize >= BIG && adapter.limits.maxBufferSize >= BIG;
  const device = await adapter.requestDevice(canBig ? { requiredLimits: { maxStorageBufferBindingSize: BIG } } : {});
  if (!canBig) console.warn('[vb] adapter caps storage bindings at', adapter.limits.maxStorageBufferBindingSize, '— using the shorter 192-voxel world');
  device.addEventListener('uncapturederror', (e) => { console.error('[vb] gpu error:', e.error.message); });
  const canvas = $('c');
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });

  // ── ENDLESS WORLD ── voxel = 10 cm. A 768×160×768 window (94 MB u8) slides with the player over an
  // infinite deterministic world. Storage is TOROIDAL: shifting the window regenerates + uploads only the
  // 8-voxel strip that wrapped — never a full-buffer move. All generation is a pure function of WORLD
  // coordinates, so strips re-materialise seamlessly and revisited terrain is always identical.
  const WX = 768, WY = canBig ? 256 : 192, WZ = 768;  // WY 256: mountains (≤105) + a 117-voxel pine still fit
  const BX = WX >> 3, BY = WY >> 3, BZ = WZ >> 3;     // 8³ brick occupancy for empty-space skipping
  const HALF = WX >> 1;
  const W = new Uint8Array(WX * WY * WZ);             // CPU copy — collision + build (toroidal)
  const W32 = new Uint32Array(W.buffer);
  const hmap = new Int16Array(WX * WZ);               // terrain top per column (toroidal)
  const bricks = new Uint32Array((BX * BY * BZ + 31) >> 5);
  let winOX = 0, winOZ = 0;                            // world coord of the window corner (multiples of 8)
  const gwrap = (v, n) => ((v % n) + n) % n;
  let SPWX = 384, SPWZ = 384;                          // world spawn — nudged east at boot if it lands in a lake

  // deterministic integer hash — the shader ports this bit-for-bit for the far-field terrain
  const ihash = (x, z) => { let h = (Math.imul(x, 374761393) + Math.imul(z, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const sstep = (t) => t * t * (3 - 2 * t);
  const vnoise = (x, z) => { const ix = Math.floor(x), iz = Math.floor(z), fx = sstep(x - ix), fz = sstep(z - iz);
    return (ihash(ix, iz) * (1 - fx) + ihash(ix + 1, iz) * fx) * (1 - fz) + (ihash(ix, iz + 1) * (1 - fx) + ihash(ix + 1, iz + 1) * fx) * fz; };
  const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.13 + 11.7, z * 2.13 + 5.3) * 0.27 + vnoise(x * 4.41 + 41.2, z * 4.41 + 23.8) * 0.18;
  const HMAX = Math.min(105, WY - 122);                // terrain ceiling
  const WL = 31;                                       // lake water level
  const LCELL = 1024;                                  // CUSTOM RARE LAKES — one candidate per ~102 m cell, 50% roll
  function lakeAt(cx, cz) {
    if (ihash(cx * 71 + 13, cz * 73 + 41) > 0.5) return null;
    return { x: cx * LCELL + 120 + ihash(cx * 3 + 55, cz * 7 + 21) * (LCELL - 240),
             z: cz * LCELL + 120 + ihash(cx * 9 + 77, cz * 5 + 3) * (LCELL - 240),
             r: 30 + ihash(cx + 31, cz + 17) * 26 };
  }
  const H = (x, z) => {                                // base terrain NEVER dips below WL+2 — water exists ONLY inside carved lake bowls
    let h = Math.min(HMAX, Math.max(WL + 2,
      Math.round(8 + 88 * fbm(x * 0.008, z * 0.008) + 9 * fbm(x * 0.04 + 7.3, z * 0.04 + 2.1))));
    for (let jz = Math.floor((z - 86) / LCELL); jz <= Math.floor((z + 86) / LCELL); jz++)
      for (let jx = Math.floor((x - 86) / LCELL); jx <= Math.floor((x + 86) / LCELL); jx++) {
        const L = lakeAt(jx, jz); if (!L) continue;
        const dx = x - L.x, dz = z - L.z, d = Math.sqrt(dx * dx + dz * dz);
        if (d >= L.r + 26) continue;
        h = Math.round(h + (WL + 2 - h) * sstep(Math.min(1, (L.r + 26 - d) / 26)));   // flatten surroundings to beach height
        if (d < L.r) h = Math.round(WL + 2 - 15 * sstep(1 - d / L.r));                // bowl — down to WL−13 at the centre
      }
    return h;
  };
  function nearLake(x, z) {                            // inside a lake's influence ring? (sand only ever appears here)
    for (let jz = Math.floor((z - 86) / LCELL); jz <= Math.floor((z + 86) / LCELL); jz++)
      for (let jx = Math.floor((x - 86) / LCELL); jx <= Math.floor((x + 86) / LCELL); jx++) {
        const L = lakeAt(jx, jz); if (!L) continue;
        const dx = x - L.x, dz = z - L.z;
        if (dx * dx + dz * dz < (L.r + 26) * (L.r + 26)) return true;
      }
    return false;
  }

  // ── palette ── slot 0 = empty. Ground grain variants + remapped tree palette with per-tree tints.
  const palette = [[0, 0, 0]];
  const addCol = (r, g, b) => (palette.push([r, g, b]), palette.length - 1);
  const NEEDLE = [addCol(97, 74, 50), addCol(88, 67, 45), addCol(106, 82, 56), addCol(80, 61, 41)];      // 1..4 (shader far-field relies on these slots)
  const MOSS   = [addCol(74, 96, 48), addCol(66, 88, 44), addCol(82, 104, 54), addCol(58, 79, 40)];      // 5..8
  const DIRT   = [addCol(112, 90, 64), addCol(102, 82, 58), addCol(122, 98, 70)];
  const ROCK   = [addCol(124, 122, 116), addCol(106, 104, 100), addCol(90, 89, 86)];
  const LOGC   = [addCol(121, 91, 57), addCol(105, 78, 49)];                                             // fallen LOG — pine-trunk browns, solid
  const SAND   = [addCol(203, 183, 145), addCol(191, 171, 133), addCol(213, 193, 155)];                  // pond beaches + lakebed

  // ── pine5.vox ── MagicaVoxel, Z-up (model z → world y)
  await stage('loading pine5.vox…');
  let vox;
  try { vox = new Uint8Array(await (await fetch('assets/v0.9/pine5.vox')).arrayBuffer()); } catch (e) { fail('failed to fetch assets/v0.9/pine5.vox — serve over http (start-server.bat)'); }
  const dv = new DataView(vox.buffer);
  let MSX = 0, MSY = 0, MSZ = 0, voxels = null; const vpal = new Uint8Array(1024);
  { const walk = (off, end) => { while (off < end) {
      const id = String.fromCharCode(vox[off], vox[off + 1], vox[off + 2], vox[off + 3]);
      const sz = dv.getUint32(off + 4, true), csz = dv.getUint32(off + 8, true);
      if (id === 'SIZE' && !MSX) { MSX = dv.getUint32(off + 12, true); MSY = dv.getUint32(off + 16, true); MSZ = dv.getUint32(off + 20, true); }
      else if (id === 'XYZI' && !voxels) { const n = dv.getUint32(off + 12, true); voxels = vox.subarray(off + 16, off + 16 + n * 4); }
      else if (id === 'RGBA') { vpal.set(vox.subarray(off + 12, off + 12 + 1024)); }
      else if (id === 'MAIN') { walk(off + 12 + sz, off + 12 + sz + csz); off += 12 + sz + csz; continue; }
      off += 12 + sz + csz;
    } };
    walk(8, vox.length);
  }
  if (!voxels) fail('pine5.vox: no model found');
  const M = new Uint8Array(MSX * MSY * MSZ);
  for (let i = 0; i < voxels.length; i += 4) M[voxels[i] + voxels[i + 1] * MSX + voxels[i + 2] * MSX * MSY] = voxels[i + 3];
  const remap = new Uint8Array(256);                   // RAW palette — the tree renders exactly as authored, no tints
  const foliageIds = [];                               // green tree voxels get NO hitbox — you can walk through the canopy
  { const used = new Set(); for (let i = 0; i < M.length; i++) if (M[i]) used.add(M[i]);
    for (const ci of used) { const r = vpal[(ci - 1) * 4], g = vpal[(ci - 1) * 4 + 1], b = vpal[(ci - 1) * 4 + 2];
      remap[ci] = addCol(r, g, b);
      if (g > r && g >= b) foliageIds.push(remap[ci]); } }
  const MROT = [];                                     // the 4 exact 90° rotations, precomputed — variation without resampling artifacts
  for (let k = 0; k < 4; k++) {
    const sx = (k & 1) ? MSY : MSX, sz = (k & 1) ? MSX : MSY;
    const A = new Uint8Array(sx * sz * MSZ);
    for (let z = 0; z < MSZ; z++) for (let y = 0; y < MSY; y++) for (let x = 0; x < MSX; x++) {
      const v = M[x + y * MSX + z * MSX * MSY]; if (!v) continue;
      let rx, rz;
      if (k === 0) { rx = x; rz = y; }
      else if (k === 1) { rx = MSY - 1 - y; rz = x; }
      else if (k === 2) { rx = MSX - 1 - x; rz = MSY - 1 - y; }
      else { rx = y; rz = MSX - 1 - x; }
      A[rx + rz * sx + z * sx * sz] = v;
    }
    MROT.push({ A, sx, sz });
  }
  // walk-through DECOR (grass, ferns) lives at the TOP of the palette — solid() ignores ids >= DECOR_MIN, rays still hit them
  const DECOR_MIN = palette.length;
  const GRASS = [addCol(83, 108, 54), addCol(74, 99, 49), addCol(92, 117, 61), addCol(65, 88, 45)];      // = the MOSS palette, only ~12% brighter — strands blend into their patch
  const FERN  = [addCol(52, 104, 58), addCol(62, 118, 66), addCol(44, 92, 50)];
  const WATER_T = addCol(56, 124, 150), WATER_B = addCol(49, 113, 139);                                  // pond surface / body, close shades (walk-through — you swim)
  const PEBBLE  = [addCol(122, 120, 114), addCol(103, 101, 97)];                                         // SMALL rock — right-click to pick up
  const STICK_S = addCol(126, 95, 59), STICK_M = addCol(111, 83, 52);                                    // twig (pickable) / stick — pine-trunk browns
  const BLOOM   = [addCol(198, 62, 54), addCol(226, 192, 62), addCol(230, 228, 220), addCol(152, 94, 192), addCol(224, 122, 162), addCol(228, 142, 56)];   // flower heads
  const solidTab = new Uint8Array(256);                // per-id collision: terrain/trunks/logs solid; decor + FOLIAGE walk-through
  for (let i = 1; i < DECOR_MIN; i++) solidTab[i] = 1;
  for (const f of foliageIds) solidTab[f] = 0;
  console.log('[vb] pine5.vox', MSX, MSY, MSZ, 'palette', palette.length, 'decor from', DECOR_MIN, 'foliage ids', foliageIds.length);

  // ── deterministic world-coordinate generation ──────────────────────────────
  function fillColumn(wx, wz) {                        // terrain + lakes + twigs + grass; CLEARS the column above (removes stale trees)
    const gx = gwrap(wx, WX), gz = gwrap(wz, WZ);
    const h = H(wx, wz);
    hmap[gx + gz * WX] = h;                            // hmap = the GROUND (lakebeds included — you walk on them, underwater)
    const lake = h <= WL;
    const mossy = !lake && fbm(wx * 0.031 + 31.7, wz * 0.031 + 17.2) > 0.52;   // 0.56 → 0.52 ≈ +30% moss coverage
    const base = gx + gz * WX * WY;
    let surfMoss = false;                              // grass only grows where a MOSS surface voxel actually landed
    for (let y = 0; y < WY; y++) {
      let c = 0;
      if (y < h) {
        const d = h - 1 - y;
        if (d === 0) {
          const shore = h <= WL + 8 && nearLake(wx, wz);             // sand exists ONLY around actual lakes
          if (shore && h <= WL + 3) c = SAND[(ihash(wx * 3 + 1, wz * 3 + 7) * 3) | 0];                   // beach ring + sandy lakebed
          else if (shore && ihash(wx * 7 + 5, wz * 11 + 3) > (h - WL - 3) / 5.5) c = SAND[(ihash(wx * 3 + 1, wz * 3 + 7) * 3) | 0];   // dithered sand→forest-floor blend
          else { c = (mossy ? MOSS : NEEDLE)[(ihash(wx * 3 + 1, wz * 3 + 7) * 4) | 0]; surfMoss = mossy; }
        }
        else if (d < 3) c = DIRT[(ihash(wx, y * 131 + wz) * 3) | 0];
        else c = ROCK[(ihash(wx + y * 57, wz) * 3) | 0];
      } else if (lake && y <= WL) c = y === WL ? WATER_T : WATER_B;
      W[base + y * WX] = c;
    }
    if (surfMoss && h + 4 < WY) {                      // GRASS STRANDS: moss patches ONLY, 1–4 voxels tall, moss-matched colors
      if (ihash(wx * 3 + 41, wz * 3 + 87) < 0.06) {
        const gh = 1 + ((ihash(wx * 5 + 3, wz * 7 + 9) * 4) | 0);
        const gc = GRASS[(ihash(wx + 13, wz * 13) * 4) | 0];
        for (let k = 0; k < gh; k++) { const ii = base + (h + k) * WX; if (W[ii]) break; W[ii] = gc; }
      }
    }
    if (!lake && h > WL + 4 && h + 3 < WY) {           // FLOWERS: sparse everywhere, denser in meadow patches; stems match the grass
      const meadow = fbm(wx * 0.019 + 63.1, wz * 0.019 + 44.9) > 0.60;
      if (ihash(wx * 9 + 71, wz * 5 + 29) < (meadow ? 0.035 : 0.003)) {
        const s0 = base + h * WX;
        if (!W[s0] && !W[s0 + WX]) {
          W[s0] = GRASS[(ihash(wx + 13, wz * 13) * 4) | 0];
          W[s0 + WX] = BLOOM[(ihash(wx * 17 + 3, wz * 23 + 11) * 6) | 0];
        }
      }
    }
  }
  const BCELL = 34;                                    // one rock candidate per 3.4 m cell (2× the 48-cell density, 4× the original)
  function boulderAt(cx, cz) {
    if (ihash(cx * 29 + 7, cz * 31 + 3) > 0.5) return null;
    const bx = Math.round(cx * BCELL + 4 + ihash(cx * 3 + 40, cz * 7 + 90) * (BCELL - 8));
    const bz = Math.round(cz * BCELL + 4 + ihash(cx * 13 + 6, cz * 5 + 44) * (BCELL - 8));
    if (H(bx, bz) <= WL + 1) return null;              // no rocks in ponds
    const sr = ihash(cx * 17 + 9, cz * 19 + 2);
    const size = sr < 0.55 ? 0 : (sr < 0.86 ? 1 : 2);  // small pebble (pickable) / medium / large
    const rr = size === 0 ? 1.0 + sr * 0.9 : size === 1 ? 2.0 + sr * 1.2 : 3.4 + sr * 1.4;
    return { bx, bz, rr, size };
  }
  function stampBoulder(b, x0, x1, z0, z1) {           // clipped to a world-coord region
    if (b.size === 0) {                                // PEBBLE: 1–2 voxels proud of the ground, decor ids → right-click pickup
      const by = H(b.bx, b.bz);
      for (let dz = -1; dz <= 1; dz++) { const z = b.bz + dz; if (z < z0 || z >= z1) continue;
        for (let dx = -1; dx <= 1; dx++) { const x = b.bx + dx; if (x < x0 || x >= x1) continue;
          for (let dy = 0; dy <= 1; dy++) {
            if (dx * dx + dz * dz + dy * dy * 2.2 > b.rr * b.rr) continue;
            const y = by + dy; if (y < 1 || y >= WY) continue;
            const ii = gwrap(x, WX) + y * WX + gwrap(z, WZ) * WX * WY;
            if (!W[ii]) W[ii] = PEBBLE[(ihash(x + y, z - y) * 2) | 0];
          } } }
      return;
    }
    const by = H(b.bx, b.bz) - 1;
    const R = Math.ceil(b.rr) + 1;
    for (let dz = -R; dz <= R; dz++) { const z = b.bz + dz; if (z < z0 || z >= z1) continue;
      for (let dx = -R; dx <= R; dx++) { const x = b.bx + dx; if (x < x0 || x >= x1) continue;
        for (let dy = -R; dy <= R; dy++) {
          if (dx * dx + dy * dy * 1.6 + dz * dz > b.rr * b.rr) continue;
          const y = by + dy; if (y < 1 || y >= WY) continue;
          const gx = gwrap(x, WX), gz = gwrap(z, WZ);
          W[gx + y * WX + gz * WX * WY] = ROCK[(ihash(x + y, z - y) * 3) | 0];
          if (y >= hmap[gx + gz * WX]) hmap[gx + gz * WX] = y + 1;
        } } }
  }
  const RCELL = 384, RMARGIN = 56;                     // LARGE ROCK FORMATIONS: occasional craggy outcrops, one candidate per 38 m cell
  function formationAt(cx, cz) {
    if (ihash(cx * 41 + 17, cz * 43 + 29) > 0.38) return null;
    const fx = cx * RCELL + 60 + ihash(cx * 3 + 90, cz * 5 + 12) * (RCELL - 120);
    const fz = cz * RCELL + 60 + ihash(cx * 7 + 33, cz * 11 + 71) * (RCELL - 120);
    const n = 3 + ((ihash(cx + 5, cz + 9) * 4) | 0);
    const baseY = H(Math.round(fx), Math.round(fz));
    const lumps = [];
    for (let i = 0; i < n; i++) {                      // stacked, offset ellipsoid lumps → a rising crag
      const a = ihash(cx * 13 + i * 7, cz * 17 + i * 5) * 6.283;
      const d = ihash(cx * 19 + i * 3, cz * 23 + i * 11) * 15;
      lumps.push({ x: Math.round(fx + Math.cos(a) * d), z: Math.round(fz + Math.sin(a) * d), y: baseY - 4 + i * 5,
        rx: 7 + ihash(cx + i * 29, cz + i * 31) * 9, ry: 8 + ihash(cx + i * 37, cz + i * 41) * 12, rz: 7 + ihash(cx + i * 43, cz + i * 47) * 9 });
    }
    return lumps;
  }
  function stampFormation(lumps, x0, x1, z0, z1) {
    for (const L of lumps) {
      const Rx = Math.ceil(L.rx), Ry = Math.ceil(L.ry), Rz = Math.ceil(L.rz);
      for (let dz = -Rz; dz <= Rz; dz++) { const z = L.z + dz; if (z < z0 || z >= z1) continue;
        for (let dx = -Rx; dx <= Rx; dx++) { const x = L.x + dx; if (x < x0 || x >= x1) continue;
          const jag = 0.8 + ihash(x * 7 + 1, z * 9 + 4) * 0.32;    // per-column radius jitter → vertical fluting, craggy silhouette
          for (let dy = -Ry; dy <= Ry; dy++) {
            if ((dx * dx) / (L.rx * L.rx) + (dy * dy) / (L.ry * L.ry) + (dz * dz) / (L.rz * L.rz) > jag) continue;
            const y = L.y + dy; if (y < 1 || y >= WY) continue;
            const gx = gwrap(x, WX), gz = gwrap(z, WZ);
            W[gx + y * WX + gz * WX * WY] = ROCK[(ihash(x + y * 3, z - y) * 3) | 0];
            if (y >= hmap[gx + gz * WX]) hmap[gx + gz * WX] = y + 1;   // climbable
          } } }
    }
  }
  function nearFormation(wx, wz) {                     // trees keep off the crags
    for (let cz = Math.floor((wz - 96) / RCELL); cz <= Math.floor((wz + 96) / RCELL); cz++)
      for (let cx = Math.floor((wx - 96) / RCELL); cx <= Math.floor((wx + 96) / RCELL); cx++) {
        const lumps = formationAt(cx, cz); if (!lumps) continue;
        for (const L of lumps) { const dx = wx - L.x, dz = wz - L.z, r = Math.max(L.rx, L.rz) + 3; if (dx * dx + dz * dz < r * r) return true; }
      }
    return false;
  }
  const FCELL = 24;                                    // FERNS: one candidate per 2.4 m cell (walk-through decor), 3 sizes
  const FERN_ARCH = [[0, 1, 2, 2, 1], [0, 1, 2, 3, 3, 2], [0, 1, 2, 3, 4, 4, 3, 2]];   // small = the ORIGINAL fern; medium; large = big + THICK
  const FERN_STEM = [2, 3, 4];
  function fernAt(cx, cz) {
    if (ihash(cx * 53 + 11, cz * 59 + 23) > 0.30) return null;
    const sr = ihash(cx * 23 + 5, cz * 29 + 13);
    const f = { wx: Math.round(cx * FCELL + 3 + ihash(cx * 5 + 1, cz * 3 + 7) * (FCELL - 6)),

      const gspd = Math.hypot(P.hvx, P.hvz);
      bobAmp += ((P.onGround ? Math.min(1, gspd / WALK) : 0) - bobAmp) * (1 - Math.exp(-8 * dt));
      bobPhase += gspd * dt * 0.5;
    }

    // ── stream the world window toward the player ──
    stepShifts();

    // ── sun ──
    if (sunAnim) sunAz += dt * (Math.PI * 2 / 120);
    const sxz = Math.cos(0.72), syy = Math.sin(0.72);
    const sun = [Math.cos(sunAz) * sxz, syy, Math.sin(sunAz) * sxz];

    // ── camera basis ── (positions sent to the GPU are WINDOW-RELATIVE for f32 precision at any distance)
    const cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
    const fwd = [Math.sin(P.yaw) * cp, sp, Math.cos(P.yaw) * cp];
    const right = [Math.cos(P.yaw), 0, -Math.sin(P.yaw)];
    const up = [-Math.sin(P.yaw) * sp, cp, -Math.cos(P.yaw) * sp];
    const bob = bobAmp * 0.14;                         // halved — the bob was reading as jitter
    const cam = [
      P.x + right[0] * Math.sin(bobPhase) * bob,
      smoothEye + Math.sin(bobPhase * 2) * bob,
      P.z + right[2] * Math.sin(bobPhase) * bob];
    if (!locked) {                                     // ESC menu: the whole CAMERA drifts gently — the entire image sways
      const ts = now * 0.001;
      cam[0] += Math.sin(ts * 0.42) * 0.9;
      cam[1] += Math.sin(ts * 0.61 + 1.7) * 0.55;
      cam[2] += Math.cos(ts * 0.37) * 0.9;
    }
    const tanH = Math.tan(FOV / 2), aspect = RW / RH;
    const j = JIT[frame & 7];

    // ── uniforms ──
    const set3 = (o, v3, w) => { UF[o] = v3[0]; UF[o + 1] = v3[1]; UF[o + 2] = v3[2]; UF[o + 3] = w; };
    set3(0, [cam[0] - winOX, cam[1], cam[2] - winOZ], tanH);
    set3(4, right, aspect); set3(8, up, frame); set3(12, fwd, now / 1000);
    set3(16, [prevCam.pos[0] - winOX, prevCam.pos[1], prevCam.pos[2] - winOZ], prevCam.tanH);
    set3(20, prevCam.right, prevCam.aspect);
    const uw = waterAt(Math.floor(cam[0]), Math.floor(cam[1]), Math.floor(cam[2]));
    set3(24, prevCam.up, sunAnim ? 10 : 64); set3(28, prevCam.fwd, (godRays ? 1 : 0) + (uw ? 2 : 0) + (rocksInv > 0 ? 4 : 0));
    set3(32, sun, resetHist);
    UF[36] = RW; UF[37] = RH; UF[38] = j[0]; UF[39] = j[1];
    UF[40] = prevCam.jit[0]; UF[41] = prevCam.jit[1]; UF[42] = CW; UF[43] = CH;
    UF[44] = winOX; UF[45] = winOZ; UF[46] = gwrap(winOX, WX); UF[47] = gwrap(winOZ, WZ);
    device.queue.writeBuffer(uniBuf, 0, UF);

    // ── passes ──
    const par = frame & 1;
    const enc = device.createCommandEncoder();
    if (xStripPending >= 0) {                          // strip scatter runs before this frame's trace
      const p = enc.beginComputePass(); p.setPipeline(pScatter); p.setBindGroup(0, bgScatter);
      p.dispatchWorkgroups(Math.ceil(STRIPW / 256)); p.end();
      xStripPending = -1;
    }
    const gw = Math.ceil(RW / 8), gh = Math.ceil(RH / 8);
    const run = (pipe, bg) => { const p = enc.beginComputePass(); p.setPipeline(pipe); p.setBindGroup(0, bg); p.dispatchWorkgroups(gw, gh); p.end(); };
    run(pTrace, bgTrace);
    run(pTemporal, bgTemporal[par]);
    run(pSpatial, bgSpatial[par]);
    run(pComposite, bgComposite);
    run(pTaa, bgTaa[par]);
    const rp = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    rp.setPipeline(pBlit); rp.setBindGroup(0, bgBlit[par]); rp.draw(3); rp.end();
    device.queue.submit([enc.finish()]);

    // ── save prev cam (world coords) ──
    prevCam.pos = cam; prevCam.right = right; prevCam.up = up; prevCam.fwd = fwd;
    prevCam.tanH = tanH; prevCam.aspect = aspect; prevCam.jit = j;
    resetHist = 0;
    frame++;

    // ── hud ──
    hudT += dt;
    if (hudT > 0.25) {
      hudT = 0;
      hudEl.textContent = `${fpsEma.toFixed(0)} fps${vsyncOn ? '' : ' (uncapped)'}  ${RW}×${RH} (${renderScale.toFixed(2)}×)\n` +
        `xyz ${(P.x / 10).toFixed(1)} ${(P.y / 10).toFixed(1)} ${(P.z / 10).toFixed(1)} m${P.fly ? '  FLY' : ''}${P.crouch ? '  crouch' : ''}${sunAnim ? '  sun-orbit' : ''}` +
        (rocksInv || sticksInv ? `\nrocks ${rocksInv} · twigs ${sticksInv}` : '');
    }
    // V-SYNC OFF: pace frames off actual GPU completion instead of the display — true render rate, no queue flood
    if (vsyncOn || document.hidden) requestAnimationFrame(tick);   // hidden tab always idles via rAF
    else device.queue.onSubmittedWorkDone().then(() => tick(performance.now()));
  }
  tick(performance.now());
})();
</script>
</body>
</html>
