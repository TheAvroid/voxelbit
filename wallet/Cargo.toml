[package]
name = "voxelbit-wallet"
version = "0.1.0"
edition = "2024"

# The exe is wallet.exe (user 2026-09-23); the package, and so the library the
# tests import as voxelbit_wallet, keeps its name.
[[bin]]
name = "wallet"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
chrono = "0.4.45"
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "json"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
